name: FLP Rust Portable Ferry 20260818

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/flp-rust-portable-ferry-20260818.yml'

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pack current stable Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/flp-rust-ferry"
          mkdir -p "$work/meta" "$work/parts"
          rustc --version --verbose | tee "$work/meta/RUSTC_VERSION.txt"
          cargo --version --verbose | tee "$work/meta/CARGO_VERSION.txt"
          rustup show active-toolchain | tee "$work/meta/ACTIVE_TOOLCHAIN.txt"
          sysroot="$(rustc --print sysroot)"
          printf '%s\n' "$sysroot" > "$work/meta/SYSROOT.txt"
          test -x "$sysroot/bin/rustc"
          test -x "$sysroot/bin/cargo"
          tar -C "$sysroot" -cf "$work/rust-stable-portable.tar" bin lib
          bytes="$(stat -c %s "$work/rust-stable-portable.tar")"
          sha="$(sha256sum "$work/rust-stable-portable.tar" | awk '{print $1}')"
          printf 'tar_bytes=%s\ntar_sha256=%s\nrun_id=%s\nhead=%s\n' "$bytes" "$sha" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$work/meta/PACK_RECEIPT.txt"
          split -b 250M -d -a 2 --additional-suffix=.bin "$work/rust-stable-portable.tar" "$work/parts/rust-stable.part."
          find "$work/parts" -type f -printf '%f %s\n' | sort > "$work/meta/PART_BYTES.txt"
          sha256sum "$work"/parts/* | sed "s#  $work/parts/#  #" | sort -k2 > "$work/meta/PART_SHA256SUMS.txt"
          find "$work/parts" -type f -printf '%f\n' | sort > "$work/meta/PART_ORDER.txt"
          count="$(find "$work/parts" -type f | wc -l)"
          printf '%s\n' "$count" > "$work/meta/PART_COUNT.txt"
          test "$count" -le 8

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: flp-rust-portable-meta
          path: ${{ runner.temp }}/flp-rust-ferry/meta
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-00, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.00.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-01, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.01.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-02, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.02.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-03, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.03.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-04, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.04.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-05, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.05.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-06, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.06.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with: {name: flp-rust-portable-part-07, path: '${{ runner.temp }}/flp-rust-ferry/parts/rust-stable.part.07.bin', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
