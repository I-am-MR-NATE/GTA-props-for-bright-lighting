name: FLP Exact Installer Cache Ferry 20260818

on:
  pull_request:
    branches: [master]
    paths:
      - '.flp-exact-installer-cache-trigger'

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch and verify exact current FL Studio installer
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/flp-installer-cache"
          mkdir -p "$work/meta" "$work/parts"
          curl -fL --retry 5 --retry-delay 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -e 'https://support.image-line.com/' \
            'https://support.image-line.com/redirect/flstudio_win_installer' -o "$work/flstudio_win64_26.1.4.5589.exe"
          expected_sha='365e4210cad9e7fa8d1f0c1941fb2d629e45cc56232d1403bd478f941ebf0ee3'
          expected_bytes='1107195744'
          actual_sha="$(sha256sum "$work/flstudio_win64_26.1.4.5589.exe" | awk '{print $1}')"
          actual_bytes="$(stat -c %s "$work/flstudio_win64_26.1.4.5589.exe")"
          test "$actual_sha" = "$expected_sha"
          test "$actual_bytes" = "$expected_bytes"
          test "$(head -c 2 "$work/flstudio_win64_26.1.4.5589.exe")" = 'MZ'
          split -b 300M -d -a 2 --additional-suffix=.bin "$work/flstudio_win64_26.1.4.5589.exe" "$work/parts/flstudio-installer.part."
          find "$work/parts" -type f -printf '%f\n' | sort > "$work/meta/PART_ORDER.txt"
          find "$work/parts" -type f -printf '%f %s\n' | sort > "$work/meta/PART_BYTES.txt"
          sha256sum "$work"/parts/* | sed "s#  $work/parts/#  #" | sort -k2 > "$work/meta/PART_SHA256SUMS.txt"
          printf 'file=flstudio_win64_26.1.4.5589.exe\nbytes=%s\nsha256=%s\nrun_id=%s\nhead=%s\n' "$actual_bytes" "$actual_sha" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$work/meta/RECEIPT.txt"
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with: {name: flp-exact-installer-meta, path: '${{ runner.temp }}/flp-installer-cache/meta', compression-level: 1, retention-days: 1, if-no-files-found: error}
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: {name: flp-exact-installer-part-00, path: '${{ runner.temp }}/flp-installer-cache/parts/flstudio-installer.part.00.bin', compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: {name: flp-exact-installer-part-01, path: '${{ runner.temp }}/flp-installer-cache/parts/flstudio-installer.part.01.bin', compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: {name: flp-exact-installer-part-02, path: '${{ runner.temp }}/flp-installer-cache/parts/flstudio-installer.part.02.bin', compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: {name: flp-exact-installer-part-03, path: '${{ runner.temp }}/flp-installer-cache/parts/flstudio-installer.part.03.bin', compression-level: 0, retention-days: 1, if-no-files-found: error}
