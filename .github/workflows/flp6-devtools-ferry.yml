name: FLP6 Runtime Ferries

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp6-devtools-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devtools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download FLP development tools
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _devtools/wheels
          python3 --version > _devtools/PYTHON_VERSION.txt
          python3 -m pip download --dest _devtools/wheels build wheel pytest ruff
          find _devtools/wheels -type f -print0 | sort -z | xargs -0 sha256sum > _devtools/SHA256SUMS.txt
          find _devtools/wheels -maxdepth 1 -type f -printf '%f\n' | sort > _devtools/FILES.txt
          printf 'head=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > _devtools/RECEIPT.txt
      - name: Upload devtools
        uses: actions/upload-artifact@v4
        with:
          name: flp6-devtools
          path: _devtools
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  wine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify Wine 11.0 WoW64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _wine
          url='https://github.com/Kron4ek/Wine-Builds/releases/download/11.0/wine-11.0-amd64-wow64.tar.xz'
          expected='39574efa1132c3ca0d5c77dd2eddbe4a49cca0d6cc2c290ff4924493a1c40314'
          curl --fail --location --retry 5 --retry-all-errors "$url" -o _wine/wine-11.0-amd64-wow64.tar.xz
          printf '%s  %s\n' "$expected" '_wine/wine-11.0-amd64-wow64.tar.xz' | sha256sum -c -
          sha256sum _wine/wine-11.0-amd64-wow64.tar.xz > _wine/SHA256SUMS.txt
          tar -tf _wine/wine-11.0-amd64-wow64.tar.xz > _wine/TAR_LIST.txt
          sed -n '1,30p' _wine/TAR_LIST.txt > _wine/TAR_HEAD.txt
          printf 'source=%s\nexpected_sha256=%s\nhead=%s\nrun_id=%s\nrun_attempt=%s\n' "$url" "$expected" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > _wine/RECEIPT.txt
      - name: Upload Wine
        uses: actions/upload-artifact@v4
        with:
          name: flp6-wine-11-wow64
          path: _wine
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
