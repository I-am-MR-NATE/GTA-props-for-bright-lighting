name: Private-only FLP public ferry purge

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/private-only-flp-purge.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout public ferry repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Best-effort make repository private
        shell: bash
        run: |
          set -u
          code="$(curl -sS -o /tmp/privacy-response.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            -d '{"private":true}')"
          echo "repository_visibility_patch_http=$code"
          cat /tmp/privacy-response.json || true
          # Continue even if GitHub correctly requires stronger repository-admin authority.
          exit 0

      - name: Close any remaining open pull requests
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number --jq '.[].number' | while read -r n; do
            [ -n "$n" ] || continue
            gh pr close "$n" --repo "$GITHUB_REPOSITORY" --comment 'Closed: FLP Builder/armory project material is private-only. Public ferry routes are retired.' || true
          done

      - name: Delete all existing Actions artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done

      - name: Replace master with clean orphan retirement commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'MEGA DAN privacy cleanup'
          git config user.email 'privacy-cleanup@users.noreply.github.com'
          git checkout --orphan __private_only_retired
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cat > README.md <<'EOF'
          # Retired public ferry surface

          This repository is not an FLP Builder, MEGA DAN Toolbelt, armory, runtime, fixture, test or publication surface.

          All FLP Builder / MEGA DAN Toolbelt project work is private-only and belongs in the private project repository.
          EOF
          git add README.md
          git commit -m 'Retire public FLP ferry surface'
          git push --force origin HEAD:master

      - name: Delete every non-master branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | while read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" = master ] && continue
            git push origin --delete "$branch" || true
          done

      - name: Final branch inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          git ls-remote --heads origin
