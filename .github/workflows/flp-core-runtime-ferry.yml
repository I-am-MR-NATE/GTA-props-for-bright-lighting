# trigger: 2026-08-18T05:37Z python313
name: FLP Core Runtime Ferry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/flp-core-runtime-ferry.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp-core-runtime-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download full current FLP Builder Python runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _runtime/python-wheels
          python3 --version | tee _runtime/PYTHON_VERSION.txt
          cat > _runtime/PYPROJECT_CORE_REQUIREMENTS.txt <<'EOF'
          luaparser>=3.3.1,<4
          mido>=1.3.3,<2
          pedalboard>=0.9.24,<0.10
          pefile>=2024.8.26,<2025
          psutil>=6.1,<8
          EOF
          cat > _runtime/PARSER_ANALYSIS_REQUIREMENTS.txt <<'EOF'
          pyflp==2.2.1
          pefile>=2024.8.26,<2025
          lief==1.0.0
          construct
          construct-typing
          capstone
          unicorn
          kaitaistruct
          EOF
          python3 -m pip download --dest _runtime/python-wheels \
            -r _runtime/PYPROJECT_CORE_REQUIREMENTS.txt \
            -r _runtime/PARSER_ANALYSIS_REQUIREMENTS.txt
          find _runtime/python-wheels -maxdepth 1 -type f -printf '%f\n' | sort | tee _runtime/PYTHON_WHEELS.txt
          sha256sum _runtime/python-wheels/* | sort -k2 > _runtime/PYTHON_WHEELS_SHA256SUMS.txt

      - name: Upload full runtime wheel cache
        uses: actions/upload-artifact@v4
        with:
          name: flp-full-runtime-wheels
          path: _runtime
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
