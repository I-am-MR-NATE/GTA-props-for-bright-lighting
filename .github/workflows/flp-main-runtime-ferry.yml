name: FLP Main Runtime Ferry

on:
  pull_request:
    branches: [master]
    paths:
      - '.flp-main-runtime-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact FLP Builder main runtime wheels
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _runtime/python-wheels
          python -m pip download --dest _runtime/python-wheels \
            'setuptools>=69' \
            'luaparser>=3.3.1,<4' \
            'mido>=1.3.3,<2' \
            'pedalboard>=0.9.24,<0.10' \
            'pefile>=2024.8.26,<2025' \
            'psutil>=6.1,<8'
          python --version | tee _runtime/PYTHON_VERSION.txt
          find _runtime/python-wheels -maxdepth 1 -type f -printf '%f\n' | sort | tee _runtime/PYTHON_WHEELS.txt
          sha256sum _runtime/python-wheels/* | sort -k2 > _runtime/PYTHON_WHEELS_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flp-main-runtime-py313
          path: _runtime
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
