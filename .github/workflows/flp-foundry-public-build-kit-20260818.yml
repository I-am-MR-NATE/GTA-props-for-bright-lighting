name: FLP Foundry Public Build Kit 20260818

on:
  pull_request:
    branches: [master]
    paths:
      - '.foundry-public-build-kit-trigger'

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Assemble exact public cross-build kit
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/foundry-build-kit"
          mkdir -p "$root/src" "$root/rust-targets" "$root/toolchain" "$root/meta"
          rustc --version --verbose | tee "$root/meta/RUSTC.txt"
          cargo --version --verbose | tee "$root/meta/CARGO.txt"
          rustup target add x86_64-pc-windows-gnullvm i686-pc-windows-gnullvm
          sysroot="$(rustc --print sysroot)"
          cp -a "$sysroot/lib/rustlib/x86_64-pc-windows-gnullvm" "$root/rust-targets/"
          cp -a "$sysroot/lib/rustlib/i686-pc-windows-gnullvm" "$root/rust-targets/"

          git clone https://github.com/HelgeSverre/rust-vst3-host.git "$root/src/rust-vst3-host"
          git -C "$root/src/rust-vst3-host" checkout ed054908cfe057694d8cf037d0c39dfb5eb4c2ca
          printf '%s\n' ed054908cfe057694d8cf037d0c39dfb5eb4c2ca > "$root/meta/VST3_SHA.txt"
          (cd "$root/src/rust-vst3-host" && cargo vendor --locked "$root/vendor-vst3" > "$root/meta/VST3_CARGO_CONFIG.toml")

          git clone https://github.com/RustAudio/vst-rs.git "$root/src/rust-vst2-host"
          git -C "$root/src/rust-vst2-host" checkout 8b38c29bb8f25d81bbc6ccf93b6575a7b17a1401
          printf '%s\n' 8b38c29bb8f25d81bbc6ccf93b6575a7b17a1401 > "$root/meta/VST2_SHA.txt"
          (cd "$root/src/rust-vst2-host" && cargo vendor "$root/vendor-vst2" > "$root/meta/VST2_CARGO_CONFIG.toml")

          url='https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz'
          curl -fL --retry 5 --retry-all-errors "$url" -o "$root/toolchain/llvm-mingw.tar.xz"
          tar -xJf "$root/toolchain/llvm-mingw.tar.xz" -C "$root/toolchain"
          rm "$root/toolchain/llvm-mingw.tar.xz"
          printf '%s\n' "$url" > "$root/meta/LLVM_MINGW_URL.txt"

          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$root/meta/SHA256SUMS.txt"

      - name: Pack and split kit into four fixed parts
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/foundry-ferry"
          root="$RUNNER_TEMP/foundry-build-kit"
          mkdir -p "$stage/parts" "$stage/meta"
          tar -C "$root" -cf "$stage/foundry-build-kit.tar" .
          sha256sum "$stage/foundry-build-kit.tar" > "$stage/meta/PACK_SHA256.txt"
          wc -c < "$stage/foundry-build-kit.tar" | tr -d ' ' > "$stage/meta/PACK_BYTES.txt"
          python3 - "$stage/foundry-build-kit.tar" "$stage/parts" <<'PY'
          from pathlib import Path
          import math, sys
          src=Path(sys.argv[1]); out=Path(sys.argv[2]); data_size=src.stat().st_size
          count=4; piece=math.ceil(data_size/count)
          with src.open('rb') as f:
              for i in range(count):
                  p=out/f'foundry-build-kit.part.{i:02d}.bin'
                  remaining=min(piece, data_size-i*piece)
                  with p.open('wb') as w:
                      while remaining>0:
                          b=f.read(min(8*1024*1024,remaining))
                          if not b: break
                          w.write(b); remaining-=len(b)
                  if p.stat().st_size == 0:
                      raise SystemExit(f'empty fixed part {i}')
          PY
          find "$stage/parts" -type f -print0 | sort -z | xargs -0 sha256sum > "$stage/meta/PART_SHA256SUMS.txt"
          find "$stage/parts" -type f -printf '%f\n' | sort > "$stage/meta/PART_ORDER.txt"
          find "$stage/parts" -type f -printf '%f %s\n' | sort > "$stage/meta/PART_BYTES.txt"
          rm "$stage/foundry-build-kit.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-build-kit-meta
          path: ${{ runner.temp }}/foundry-ferry/meta
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-build-kit-part-00
          path: ${{ runner.temp }}/foundry-ferry/parts/foundry-build-kit.part.00.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-build-kit-part-01
          path: ${{ runner.temp }}/foundry-ferry/parts/foundry-build-kit.part.01.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-build-kit-part-02
          path: ${{ runner.temp }}/foundry-ferry/parts/foundry-build-kit.part.02.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-build-kit-part-03
          path: ${{ runner.temp }}/foundry-ferry/parts/foundry-build-kit.part.03.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
