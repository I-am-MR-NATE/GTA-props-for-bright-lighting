name: FLP Foundry Public Build Kit 20260818

on:
  pull_request:
    branches: [master]
    paths:
      - '.foundry-public-build-kit-trigger'

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Assemble exact public cross-build kit
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/foundry-build-kit"
          pack="$RUNNER_TEMP/foundry-build-pack"
          mkdir -p "$root/src" "$root/rust-targets" "$root/toolchain" "$root/meta" "$pack"
          rustc --version --verbose | tee "$root/meta/RUSTC.txt"
          cargo --version --verbose | tee "$root/meta/CARGO.txt"
          rustup target add x86_64-pc-windows-gnullvm i686-pc-windows-gnullvm
          sysroot="$(rustc --print sysroot)"
          cp -a "$sysroot/lib/rustlib/x86_64-pc-windows-gnullvm" "$root/rust-targets/"
          cp -a "$sysroot/lib/rustlib/i686-pc-windows-gnullvm" "$root/rust-targets/"

          git clone https://github.com/HelgeSverre/rust-vst3-host.git "$root/src/rust-vst3-host"
          git -C "$root/src/rust-vst3-host" checkout ed054908cfe057694d8cf037d0c39dfb5eb4c2ca
          printf '%s\n' ed054908cfe057694d8cf037d0c39dfb5eb4c2ca > "$root/meta/VST3_SHA.txt"
          (cd "$root/src/rust-vst3-host" && cargo vendor --locked "$root/vendor-vst3" > "$root/meta/VST3_CARGO_CONFIG.toml")

          git clone https://github.com/RustAudio/vst-rs.git "$root/src/rust-vst2-host"
          git -C "$root/src/rust-vst2-host" checkout 8b38c29bb8f25d81bbc6ccf93b6575a7b17a1401
          printf '%s\n' 8b38c29bb8f25d81bbc6ccf93b6575a7b17a1401 > "$root/meta/VST2_SHA.txt"
          (cd "$root/src/rust-vst2-host" && cargo vendor "$root/vendor-vst2" > "$root/meta/VST2_CARGO_CONFIG.toml")

          url='https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-ubuntu-22.04-x86_64.tar.xz'
          curl -fL --retry 5 --retry-all-errors "$url" -o "$root/toolchain/llvm-mingw.tar.xz"
          tar -xJf "$root/toolchain/llvm-mingw.tar.xz" -C "$root/toolchain"
          rm "$root/toolchain/llvm-mingw.tar.xz"
          printf '%s\n' "$url" > "$root/meta/LLVM_MINGW_URL.txt"

          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum > "$root/meta/SHA256SUMS.txt"
          tar -C "$root" --zstd -cf "$pack/foundry-build-kit.tar.zst" .
          sha256sum "$pack/foundry-build-kit.tar.zst" > "$pack/WHOLE_SHA256.txt"
          stat -c '%s foundry-build-kit.tar.zst' "$pack/foundry-build-kit.tar.zst" > "$pack/WHOLE_BYTES.txt"
          split -b 240M -d -a 2 --additional-suffix=.bin "$pack/foundry-build-kit.tar.zst" "$pack/foundry-build-kit.part."
          sha256sum "$pack"/foundry-build-kit.part.* > "$pack/PART_SHA256SUMS.txt"
          find "$pack" -name 'foundry-build-kit.part.*' -printf '%f %s\n' | sort > "$pack/PART_BYTES.txt"
          rm "$pack/foundry-build-kit.tar.zst"

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-public-build-kit-meta
          path: |
            ${{ runner.temp }}/foundry-build-pack/WHOLE_SHA256.txt
            ${{ runner.temp }}/foundry-build-pack/WHOLE_BYTES.txt
            ${{ runner.temp }}/foundry-build-pack/PART_SHA256SUMS.txt
            ${{ runner.temp }}/foundry-build-pack/PART_BYTES.txt
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-public-build-kit-part-00
          path: ${{ runner.temp }}/foundry-build-pack/foundry-build-kit.part.00.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-public-build-kit-part-01
          path: ${{ runner.temp }}/foundry-build-pack/foundry-build-kit.part.01.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-public-build-kit-part-02
          path: ${{ runner.temp }}/foundry-build-pack/foundry-build-kit.part.02.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: flp-foundry-public-build-kit-part-03
          path: ${{ runner.temp }}/foundry-build-pack/foundry-build-kit.part.03.bin
          compression-level: 0
          retention-days: 1
          if-no-files-found: ignore
