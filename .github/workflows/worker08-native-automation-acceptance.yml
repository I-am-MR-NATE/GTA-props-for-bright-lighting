name: Worker08 Native FL Automation Acceptance

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download and install current official FL Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $installer = Join-Path $env:RUNNER_TEMP 'flstudio-latest.exe'
          & curl.exe -L --fail --retry 2 --connect-timeout 30 -o $installer 'https://support.image-line.com/redirect/flstudio_win_installer'
          if ($LASTEXITCODE -ne 0) { throw "curl failed: $LASTEXITCODE" }
          $item = Get-Item $installer
          if ($item.Length -lt 100MB) { throw "installer implausibly small: $($item.Length)" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $p = Start-Process -FilePath $installer -ArgumentList '/S','/ALLUSERS=1' -Wait -PassThru
          $fl = Get-ChildItem 'C:\Program Files\Image-Line' -Filter FL64.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $fl) { throw "FL64.exe not found after installer exit $($p.ExitCode)" }
          "INSTALLER_EXIT=$($p.ExitCode)" | Out-File -FilePath "$env:RUNNER_TEMP\install.txt" -Encoding ascii
          "INSTALLER_BYTES=$($item.Length)" | Add-Content "$env:RUNNER_TEMP\install.txt"
          "INSTALLER_SHA256=$hash" | Add-Content "$env:RUNNER_TEMP\install.txt"
          "FL64_PATH=$($fl.FullName)" | Add-Content "$env:RUNNER_TEMP\install.txt"
          "FL64_SHA256=$((Get-FileHash $fl.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content "$env:RUNNER_TEMP\install.txt"
          "FL64_PATH=$($fl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact automation-curve candidate from installed factory template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flDir = Split-Path -Parent $env:FL64_PATH
          $src = Join-Path $flDir 'Data\Templates\Advanced\Electronic\Drum & Bass.flp'
          if (-not (Test-Path $src)) { throw "factory template not found: $src" }
          $srcHash = (Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($srcHash -ne '74b4b3fbab62a7e332c5087217ff7ea73a84b680424e015baa76e623216fde37') { throw "unexpected source hash: $srcHash" }
          $candidate = Join-Path $env:RUNNER_TEMP 'worker08_automation_candidate.flp'
          Copy-Item $src $candidate -Force
          [byte[]]$bytes = [System.IO.File]::ReadAllBytes($candidate)
          $off = 70076
          [byte[]]$expected = 0x33,0x33,0x13,0x3f
          for ($i=0; $i -lt 4; $i++) {
            if ($bytes[$off+$i] -ne $expected[$i]) { throw "unexpected source byte at $($off+$i): $($bytes[$off+$i])" }
          }
          [byte[]]$replacement = 0x00,0x00,0x80,0x3e
          [Array]::Copy($replacement,0,$bytes,$off,4)
          [System.IO.File]::WriteAllBytes($candidate,$bytes)
          $candHash = (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candHash -ne 'eb574ed41c7b1af3140d73b453661950524dadabec691c8d11393cad4bc63231') { throw "candidate hash mismatch: $candHash" }
          "SOURCE_PATH=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_PATH=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_SHA256=$srcHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_SHA256=$candHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Native FL project-open differential
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          function Stop-Fl {
            Get-Process FL64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

          function Capture-Screen([string]$path) {
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Left,$bounds.Top,0,0,$bmp.Size)
            $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          function Invoke-FlCase([string]$name,[string]$project) {
            Stop-Fl
            $beforeHash = (Get-FileHash $project -Algorithm SHA256).Hash.ToLowerInvariant()
            $p = Start-Process -FilePath $env:FL64_PATH -ArgumentList ('"' + $project + '"') -PassThru
            Start-Sleep -Seconds 12
            $procs = @(Get-Process FL64 -ErrorAction SilentlyContinue)
            $snap1 = @($procs | ForEach-Object { [pscustomobject]@{ id=$_.Id; responding=$_.Responding; title=$_.MainWindowTitle; modules=$_.Modules.Count } })
            Capture-Screen (Join-Path $env:RUNNER_TEMP "$name-before.png")
            $shell = New-Object -ComObject WScript.Shell
            foreach ($fp in $procs) { [void]$shell.AppActivate($fp.Id) }
            Start-Sleep -Milliseconds 500
            $shell.SendKeys('{ENTER}')
            Start-Sleep -Seconds 6
            $procs2 = @(Get-Process FL64 -ErrorAction SilentlyContinue)
            $snap2 = @($procs2 | ForEach-Object { [pscustomobject]@{ id=$_.Id; responding=$_.Responding; title=$_.MainWindowTitle; modules=$_.Modules.Count } })
            Capture-Screen (Join-Path $env:RUNNER_TEMP "$name-after.png")
            $afterHash = (Get-FileHash $project -Algorithm SHA256).Hash.ToLowerInvariant()
            $r = [pscustomobject]@{
              name=$name
              project=$project
              before_sha256=$beforeHash
              after_sha256=$afterHash
              initial_processes=$snap1
              after_enter_processes=$snap2
            }
            Stop-Fl
            return $r
          }

          $control = Invoke-FlCase 'control' $env:SOURCE_PATH
          $candidate1 = Invoke-FlCase 'candidate1' $env:CANDIDATE_PATH
          $candidate2 = Invoke-FlCase 'candidate2' $env:CANDIDATE_PATH

          $flHash = (Get-FileHash $env:FL64_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          $result = [ordered]@{
            schema='worker08.native-automation-curve-project-open.v1'
            runner_os=[System.Environment]::OSVersion.VersionString
            fl64_path=$env:FL64_PATH
            fl64_sha256=$flHash
            source_sha256=$env:SOURCE_SHA256
            candidate_sha256=$env:CANDIDATE_SHA256
            patch=[ordered]@{ offset=70076; before='3333133f'; after='0000803e'; semantic='automation point value 0.575 -> 0.25' }
            control=$control
            candidate_first_open=$candidate1
            candidate_clean_reopen=$candidate2
          }
          $jsonPath = Join-Path $env:RUNNER_TEMP 'worker08-native-automation-acceptance.json'
          $result | ConvertTo-Json -Depth 8 | Set-Content $jsonPath -Encoding utf8
          Get-Content $jsonPath

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: worker08-native-automation-acceptance
          path: |
            ${{ runner.temp }}/worker08-native-automation-acceptance.json
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/control-before.png
            ${{ runner.temp }}/control-after.png
            ${{ runner.temp }}/candidate1-before.png
            ${{ runner.temp }}/candidate1-after.png
            ${{ runner.temp }}/candidate2-before.png
            ${{ runner.temp }}/candidate2-after.png
          if-no-files-found: error
          retention-days: 1
