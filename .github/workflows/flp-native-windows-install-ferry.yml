name: FLP Native Windows Install Ferry

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp-native-windows-install-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-pack:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Download and silently install current official FL Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\flp-ferry'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $installer = Join-Path $work 'flstudio-latest.exe'
          $url = 'https://support.image-line.com/redirect/flstudio_win_installer'
          Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRedirection 10
          $bytes = (Get-Item $installer).Length
          if ($bytes -le 100MB) { throw "Installer too small: $bytes" }
          $mz = [System.IO.File]::ReadAllBytes($installer)[0..1]
          if ($mz[0] -ne 0x4d -or $mz[1] -ne 0x5a) { throw 'Installer is not MZ' }
          $installerSha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "FL Studio installer exit code $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          $unexpected = Get-Process -Name 'FL64','FL' -ErrorAction SilentlyContinue
          if ($unexpected) {
            $unexpected | Stop-Process -Force
            throw 'Installer unexpectedly launched FL Studio; stopped process and failed closed.'
          }
          $candidates = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Filter FL64.exe -Recurse -ErrorAction SilentlyContinue
          if (-not $candidates) { throw 'FL64.exe not found after installation' }
          $fl = $candidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $installRoot = Split-Path $fl.FullName -Parent
          $flSha = (Get-FileHash $fl.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $fv = (Get-Item $fl.FullName).VersionInfo.FileVersion
          $pv = (Get-Item $fl.FullName).VersionInfo.ProductVersion
          $engine = Get-ChildItem $installRoot -Filter FLEngine_x64.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $engineSha = if ($engine) { (Get-FileHash $engine.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } else { '' }
          New-Item -ItemType Directory -Force -Path "$work\meta" | Out-Null
          @(
            "source_redirect=$url",
            "installer_bytes=$bytes",
            "installer_sha256=$installerSha",
            "install_root=$installRoot",
            "fl64_path=$($fl.FullName)",
            "fl64_sha256=$flSha",
            "file_version=$fv",
            "product_version=$pv",
            "engine_path=$($engine.FullName)",
            "engine_sha256=$engineSha",
            "runner=$env:RUNNER_OS",
            "head=$env:GITHUB_SHA",
            "run_id=$env:GITHUB_RUN_ID"
          ) | Set-Content "$work\meta\RECEIPT.txt"
          Get-ChildItem $installRoot -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($installRoot.Length).TrimStart('\')
            "$rel`t$($_.Length)"
          } | Sort-Object | Set-Content "$work\meta\FILE_LIST.tsv"
          Get-ChildItem $installRoot -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($installRoot.Length).TrimStart('\')
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $rel"
          } | Set-Content "$work\meta\FILE_SHA256SUMS.txt"
          reg export 'HKLM\SOFTWARE\Image-Line' "$work\meta\HKLM_IMAGE_LINE.reg" /y 2>$null
          reg export 'HKCU\SOFTWARE\Image-Line' "$work\meta\HKCU_IMAGE_LINE.reg" /y 2>$null
          Set-Content "$work\meta\INSTALL_ROOT.txt" $installRoot
          Set-Content "$work\meta\FL64_PATH.txt" $fl.FullName
          Write-Host "Installed root: $installRoot"
          Write-Host "FL64: $($fl.FullName) $fv $flSha"

      - name: Pack installed tree into 300 MiB volumes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = 'C:\flp-ferry'
          $root = (Get-Content "$work\meta\INSTALL_ROOT.txt" -Raw).Trim()
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { throw '7-Zip missing on Windows runner' }
          New-Item -ItemType Directory -Force -Path "$work\parts" | Out-Null
          & $seven a -t7z -mx=1 -v300m "$work\parts\flstudio-installed.7z" "$root\*"
          if ($LASTEXITCODE -ne 0) { throw "7-Zip exit code $LASTEXITCODE" }
          $parts = Get-ChildItem "$work\parts\flstudio-installed.7z.*" | Sort-Object Name
          if (-not $parts) { throw 'No install archive parts produced' }
          $parts | ForEach-Object { "$($_.Name)`t$($_.Length)" } | Set-Content "$work\meta\PART_BYTES.tsv"
          $parts | ForEach-Object {
            $h=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content "$work\meta\PART_SHA256SUMS.txt"
          $parts.Name | Set-Content "$work\meta\PART_ORDER.txt"
          Set-Content "$work\meta\PART_COUNT.txt" $parts.Count
          if ($parts.Count -gt 16) { throw "Too many parts for fixed artifact slots: $($parts.Count)" }

      - name: Upload native install metadata
        uses: actions/upload-artifact@v4
        with:
          name: flp-native-install-meta
          path: C:\flp-ferry\meta
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 001
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-001, path: 'C:\flp-ferry\parts\flstudio-installed.7z.001', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 002
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-002, path: 'C:\flp-ferry\parts\flstudio-installed.7z.002', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 003
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-003, path: 'C:\flp-ferry\parts\flstudio-installed.7z.003', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 004
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-004, path: 'C:\flp-ferry\parts\flstudio-installed.7z.004', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 005
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-005, path: 'C:\flp-ferry\parts\flstudio-installed.7z.005', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 006
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-006, path: 'C:\flp-ferry\parts\flstudio-installed.7z.006', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 007
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-007, path: 'C:\flp-ferry\parts\flstudio-installed.7z.007', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 008
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-008, path: 'C:\flp-ferry\parts\flstudio-installed.7z.008', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 009
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-009, path: 'C:\flp-ferry\parts\flstudio-installed.7z.009', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 010
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-010, path: 'C:\flp-ferry\parts\flstudio-installed.7z.010', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 011
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-011, path: 'C:\flp-ferry\parts\flstudio-installed.7z.011', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 012
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-012, path: 'C:\flp-ferry\parts\flstudio-installed.7z.012', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 013
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-013, path: 'C:\flp-ferry\parts\flstudio-installed.7z.013', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 014
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-014, path: 'C:\flp-ferry\parts\flstudio-installed.7z.014', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 015
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-015, path: 'C:\flp-ferry\parts\flstudio-installed.7z.015', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 016
        uses: actions/upload-artifact@v4
        with: {name: flp-native-install-part-016, path: 'C:\flp-ferry\parts\flstudio-installed.7z.016', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
