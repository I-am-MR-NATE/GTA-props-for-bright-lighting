# trigger: 2026-08-18 wine11 local-runtime
name: FLP Wine 11 Ferry

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/flp-wine11-ferry.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp-wine11-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify Wine 11.0 amd64-wow64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _wine
          url='https://github.com/Kron4ek/Wine-Builds/releases/download/11.0/wine-11.0-amd64-wow64.tar.xz'
          expected='39574efa1132c3ca0d5c77dd2eddbe4a49cca0d6cc2c290ff4924493a1c40314'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            --user-agent 'MEGA-DAN-FLP-Builder/1.0' "$url" -o _wine/wine-11.0-amd64-wow64.tar.xz
          actual="$(sha256sum _wine/wine-11.0-amd64-wow64.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -tf _wine/wine-11.0-amd64-wow64.tar.xz | head -50 > _wine/TAR_HEAD.txt
          tar -xf _wine/wine-11.0-amd64-wow64.tar.xz -C _wine
          test -x _wine/wine-11.0-amd64-wow64/bin/wine
          _wine/wine-11.0-amd64-wow64/bin/wine --version | tee _wine/WINE_VERSION.txt
          sha256sum _wine/wine-11.0-amd64-wow64.tar.xz > _wine/SHA256SUMS.txt
          printf 'source=%s\nexpected_sha256=%s\nactual_sha256=%s\nrun_id=%s\nhead=%s\n' \
            "$url" "$expected" "$actual" "$GITHUB_RUN_ID" "$GITHUB_SHA" > _wine/RECEIPT.txt

      - name: Upload Wine archive and receipt
        uses: actions/upload-artifact@v4
        with:
          name: flp-wine-11-amd64-wow64
          path: |
            _wine/wine-11.0-amd64-wow64.tar.xz
            _wine/WINE_VERSION.txt
            _wine/SHA256SUMS.txt
            _wine/RECEIPT.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
