name: MEGA DAN FL Native Runtime Observation 20260818

on:
  pull_request:
    paths:
      - '.mega-dan/fl-native-runtime-trigger-20260818.txt'

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Install current FL Studio and bind component bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $obs = Join-Path $env:RUNNER_TEMP 'obs'
          New-Item -ItemType Directory -Force -Path $obs | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP 'flstudio-latest.exe'
          $effective = & curl.exe -L --fail --silent --show-error -o $installer -w '%{url_effective}' 'https://support.image-line.com/redirect/flstudio_win_installer'
          if ($LASTEXITCODE -ne 0) { throw "curl installer failed: $LASTEXITCODE" }
          $size = (Get-Item $installer).Length
          if ($size -lt 100MB) { throw "installer implausibly small: $size" }
          $bytes = [System.IO.File]::ReadAllBytes($installer)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'installer missing MZ' }
          $installerSha = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $ip = Start-Process -FilePath $installer -ArgumentList '/S','/ALLUSERS=1' -Wait -PassThru
          Start-Sleep -Seconds 5
          $fl = Get-ChildItem 'C:\Program Files\Image-Line' -Recurse -Filter FL64.exe -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $fl) { throw 'FL64.exe not found' }
          $root = Split-Path -Parent $fl.FullName
          $tuner = Get-ChildItem $root -Recurse -Filter engine_x64.dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\Tuner\\' } | Select-Object -First 1
          if (-not $tuner) { throw 'Tuner engine_x64.dll not found' }
          $state = [ordered]@{
            observed_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            runner_os = [System.Environment]::OSVersion.VersionString
            installer_effective_url = $effective
            installer_bytes = $size
            installer_sha256 = $installerSha
            installer_exit = $ip.ExitCode
            fl64_path = $fl.FullName
            fl64_bytes = $fl.Length
            fl64_sha256 = (Get-FileHash $fl.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            fl64_file_version = $fl.VersionInfo.FileVersion
            tuner_path = $tuner.FullName
            tuner_bytes = $tuner.Length
            tuner_file_version = $tuner.VersionInfo.FileVersion
            tuner_last_write_utc_before = $tuner.LastWriteTimeUtc.ToString('o')
            tuner_sha256_before_pluginval = (Get-FileHash $tuner.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $state | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 "$obs\hash_stability_pre.json"
          "obs=$obs" | Out-File -FilePath $env:GITHUB_ENV -Append
          "fl64=$($fl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "tuner=$($tuner.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate Tuner natively and prove no DLL mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $zip = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'pluginval'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $pv = Get-ChildItem $dir -Recurse -Filter pluginval.exe | Select-Object -First 1
          & $pv.FullName --validate-in-process --strictness-level 5 --output-dir $env:obs $env:tuner *>&1 | Tee-Object -FilePath "$env:obs\pluginval_tuner.txt"
          $rc = $LASTEXITCODE
          $pre = Get-Content "$env:obs\hash_stability_pre.json" -Raw | ConvertFrom-Json
          $post = [ordered]@{
            pluginval_sha256 = (Get-FileHash $pv.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            pluginval_exit = $rc
            tuner_sha256_before_pluginval = $pre.tuner_sha256_before_pluginval
            tuner_sha256_after_pluginval = (Get-FileHash $env:tuner -Algorithm SHA256).Hash.ToLowerInvariant()
            tuner_last_write_utc_after_pluginval = (Get-Item $env:tuner).LastWriteTimeUtc.ToString('o')
          }
          $post | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 "$env:obs\hash_stability_pluginval.json"
          exit 0

      - name: Launch FL Studio and prove Tuner bytes remain stable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $p = Start-Process -FilePath $env:fl64 -PassThru
          Start-Sleep -Seconds 15
          $live = Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          $state = [ordered]@{
            fl_process_started = [bool]$live
            fl_main_window_handle = if ($live) { $live.MainWindowHandle.ToInt64() } else { 0 }
            fl_responding = if ($live) { $live.Responding } else { $false }
            tuner_sha256_after_fl_launch = (Get-FileHash $env:tuner -Algorithm SHA256).Hash.ToLowerInvariant()
            tuner_last_write_utc_after_fl_launch = (Get-Item $env:tuner).LastWriteTimeUtc.ToString('o')
          }
          $state | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 "$env:obs\hash_stability_fl_launch.json"
          if ($live) { Stop-Process -Id $live.Id -Force -ErrorAction SilentlyContinue }
          Get-Content "$env:obs\hash_stability_pre.json"
          Get-Content "$env:obs\hash_stability_pluginval.json"
          Get-Content "$env:obs\hash_stability_fl_launch.json"

      - name: Upload hash-stability artifact
        uses: actions/upload-artifact@v4
        with:
          name: mega-dan-fl-native-hash-stability-20260818
          path: ${{ runner.temp }}/obs
          if-no-files-found: error
          retention-days: 3
