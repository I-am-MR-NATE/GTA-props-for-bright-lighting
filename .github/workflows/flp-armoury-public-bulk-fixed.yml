name: FLP Armoury Public Bulk Acquisition Fixed

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/flp-armoury-public-bulk-fixed.yml'
      - '.flp-armoury-public-bulk-fixed-trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: flp-armoury-public-bulk-20260819

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure durable release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for n in 1 2 3 4 5 6 7; do
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
            sleep $((n * 5))
          done
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title 'FLP Armoury public bulk cargo 2026-08-19' \
            --notes 'Durable GitHub custody for the public/open-source portion of the FLP Armoury. Private Builder/Toolbelt source remains in the private North Star; FL Studio/private prefix are deliberately not published here.'

  analysis_public:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Acquire Ghidra, pluginval, flpdiff, Sonic Annotator and QM Vamp
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zstd
          A="$GITHUB_WORKSPACE/armory"
          T="$RUNNER_TEMP/raid"
          mkdir -p "$A/ghidra" "$A/tools/portable/pluginval" "$A/tools/portable/flpdiff" \
                   "$A/tools/portable/sonic-annotator" "$A/plugins/qm-vamp" "$A/bin" "$T"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip' \
            -o "$T/ghidra.zip"
          echo 'b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d  '"$T/ghidra.zip" | sha256sum --check --strict
          unzip -q "$T/ghidra.zip" -d "$A/ghidra"
          test -d "$A/ghidra/ghidra_12.1.2_PUBLIC"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip' -o "$T/pluginval.zip"
          unzip -q "$T/pluginval.zip" -d "$A/tools/portable/pluginval"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://github.com/dawhubapp/flpdiff/releases/latest/download/flpdiff-linux-x64' \
            -o "$A/tools/portable/flpdiff/flpdiff"
          chmod +x "$A/tools/portable/flpdiff/flpdiff"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://sonicvisualiser.org/pre/sonic-annotator-1.7.0-linux64-static.tar.gz' -o "$T/sonic.tgz"
          tar -xzf "$T/sonic.tgz" -C "$A/tools/portable/sonic-annotator" --strip-components=1
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://code.soundsoftware.ac.uk/attachments/download/2625/qm-vamp-plugins-1.8.0-linux64.tar.gz' -o "$T/qm-vamp.tgz"
          tar -xzf "$T/qm-vamp.tgz" -C "$A/plugins/qm-vamp"
          find "$A/tools/portable/pluginval" -type f -name pluginval -exec chmod +x {} \;
          find "$A/tools/portable/sonic-annotator" -type f -name sonic-annotator -exec chmod +x {} \;
          cat > "$A/bin/flpdiff" <<'SH'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname "$0")/.." && pwd)
          exec "$ROOT/tools/portable/flpdiff/flpdiff" "$@"
          SH
          chmod +x "$A/bin/flpdiff"
          mkdir -p release
          tar --zstd -cf release/armoury-public-analysis.tar.zst armory
          sha256sum release/armoury-public-analysis.tar.zst > release/armoury-public-analysis.tar.zst.sha256
          split -b 900M -d -a 3 release/armoury-public-analysis.tar.zst release/armoury-public-analysis.tar.zst.part
          rm release/armoury-public-analysis.tar.zst
          sha256sum release/armoury-public-analysis.tar.zst.part* > release/armoury-public-analysis.parts.sha256
      - name: Publish analysis cargo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release/* --clobber

  builder_python:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Acquire self-contained Builder Python closure
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          A="$GITHUB_WORKSPACE/armory"
          T="$RUNNER_TEMP/raid"
          PYROOT="$A/tools/portable/python-builder-3.13"
          mkdir -p "$T" "$A/bin"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260610/cpython-3.13.14%2B20260610-x86_64-unknown-linux-gnu-install_only.tar.gz' \
            -o "$T/python.tgz"
          tar -xzf "$T/python.tgz" -C "$T"
          mv "$T/python" "$PYROOT"
          PY="$PYROOT/bin/python3"
          "$PY" -m ensurepip --upgrade || true
          "$PY" -m pip install --upgrade pip setuptools wheel
          "$PY" -m pip install \
            'luaparser>=3.3.1,<4' 'mido>=1.3.3,<2' 'pedalboard>=0.9.24,<0.10' \
            'pefile>=2024.8.26,<2025' 'psutil>=6.1,<8' \
            pytest ruff pyflp lief construct construct-typing capstone unicorn kaitaistruct packaging
          "$PY" - <<'PY'
          import luaparser, mido, pedalboard, pefile, psutil, pytest, lief, construct, capstone, unicorn, kaitaistruct
          print('builder-python closure OK')
          PY
          "$PY" -m pip freeze | sort > "$A/BUILDER_PYTHON_FREEZE.txt"
          cat > "$A/bin/builder-python" <<'SH'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname "$0")/.." && pwd)
          exec "$ROOT/tools/portable/python-builder-3.13/bin/python3" "$@"
          SH
          chmod +x "$A/bin/builder-python"
          mkdir -p release
          tar --zstd -cf release/armoury-public-builder-python.tar.zst armory
          sha256sum release/armoury-public-builder-python.tar.zst > release/armoury-public-builder-python.tar.zst.sha256
          split -b 900M -d -a 3 release/armoury-public-builder-python.tar.zst release/armoury-public-builder-python.tar.zst.part
          rm release/armoury-public-builder-python.tar.zst
          sha256sum release/armoury-public-builder-python.tar.zst.part* > release/armoury-public-builder-python.parts.sha256
      - name: Publish Builder Python cargo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release/* --clobber

  audio_main:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Acquire self-contained Demucs, Essentia and CLAP runtime plus models
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          A="$GITHUB_WORKSPACE/armory"
          T="$RUNNER_TEMP/raid"
          PYROOT="$A/tools/portable/python-audio-main"
          MODEL="$A/tools/portable/audio-intelligence/models"
          mkdir -p "$MODEL/demucs" "$MODEL/clap/larger_clap_music" "$A/tools/portable/audio-intelligence/cli" "$A/bin" "$T"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260610/cpython-3.14.6%2B20260610-x86_64-unknown-linux-gnu-install_only.tar.gz' \
            -o "$T/python.tgz"
          tar -xzf "$T/python.tgz" -C "$T"
          mv "$T/python" "$PYROOT"
          PY="$PYROOT/bin/python3"
          "$PY" -m ensurepip --upgrade || true
          "$PY" -m pip install --upgrade pip setuptools wheel
          "$PY" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0' 'torchaudio==2.13.0'
          "$PY" -m pip install \
            'demucs==4.1.0' 'essentia-tensorflow==2.1b6.dev1438' \
            numpy scipy soundfile librosa pyloudnorm pretty_midi mido pedalboard pefile psutil packaging \
            onnxruntime transformers huggingface_hub accelerate 'opensmile==2.6.0' luaparser
          DEMUCS="$MODEL/demucs/955717e8-8726e21a.th"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://dl.fbaipublicfiles.com/demucs/hybrid_transformer/955717e8-8726e21a.th' -o "$DEMUCS"
          echo '8726e21a993978c7ba086d3872e7608d7d5bfca646ca4aca459ffda844faa8b4  '"$DEMUCS" | sha256sum --check --strict
          "$PY" - "$MODEL/clap/larger_clap_music" <<'PY'
          from huggingface_hub import snapshot_download
          import sys
          snapshot_download(repo_id='laion/larger_clap_music', revision='a0b4534a14f58e20944452dff00a22a06ce629d1', local_dir=sys.argv[1])
          PY
          "$PY" - <<'PY'
          import demucs, essentia, torch, torchaudio, librosa, soundfile, transformers, opensmile
          print('audio-main closure OK')
          PY
          mkdir -p release
          tar --zstd -cf release/armoury-public-audio-main.tar.zst armory
          sha256sum release/armoury-public-audio-main.tar.zst > release/armoury-public-audio-main.tar.zst.sha256
          split -b 900M -d -a 3 release/armoury-public-audio-main.tar.zst release/armoury-public-audio-main.tar.zst.part
          rm release/armoury-public-audio-main.tar.zst
          sha256sum release/armoury-public-audio-main.tar.zst.part* > release/armoury-public-audio-main.parts.sha256
      - name: Publish audio-main cargo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release/* --clobber

  audio_compat:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Acquire self-contained Basic Pitch, aubio and ViSQOL runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd build-essential
          A="$GITHUB_WORKSPACE/armory"
          T="$RUNNER_TEMP/raid"
          PYROOT="$A/tools/portable/python-audio-compat-3.11"
          mkdir -p "$A/bin" "$T"
          curl --fail --location --retry 10 --retry-all-errors --connect-timeout 30 \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260203/cpython-3.11.14%2B20260203-x86_64-unknown-linux-gnu-install_only.tar.gz' \
            -o "$T/python.tgz"
          tar -xzf "$T/python.tgz" -C "$T"
          mv "$T/python" "$PYROOT"
          PY="$PYROOT/bin/python3"
          "$PY" -m ensurepip --upgrade || true
          "$PY" -m pip install --upgrade pip setuptools wheel
          "$PY" -m pip install 'numpy<2' 'basic-pitch==0.4.0' 'aubio==0.4.9' 'visqol-python==3.7.0'
          "$PY" - <<'PY'
          from pathlib import Path
          import basic_pitch, aubio
          root=Path(basic_pitch.__file__).resolve().parent
          models=root/'saved_models'
          assert models.is_dir() and any(models.rglob('*')), models
          print('audio-compat closure OK')
          PY
          cat > "$A/bin/basic-pitch-local" <<'SH'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname "$0")/.." && pwd)
          export TF_CPP_MIN_LOG_LEVEL=2
          exec "$ROOT/tools/portable/python-audio-compat-3.11/bin/python3" -m basic_pitch.predict "$@"
          SH
          cat > "$A/bin/aubio-local" <<'SH'
          #!/bin/sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname "$0")/.." && pwd)
          exec "$ROOT/tools/portable/python-audio-compat-3.11/bin/aubio" "$@"
          SH
          chmod +x "$A/bin/basic-pitch-local" "$A/bin/aubio-local"
          mkdir -p release
          tar --zstd -cf release/armoury-public-audio-compat.tar.zst armory
          sha256sum release/armoury-public-audio-compat.tar.zst > release/armoury-public-audio-compat.tar.zst.sha256
          split -b 900M -d -a 3 release/armoury-public-audio-compat.tar.zst release/armoury-public-audio-compat.tar.zst.part
          rm release/armoury-public-audio-compat.tar.zst
          sha256sum release/armoury-public-audio-compat.tar.zst.part* > release/armoury-public-audio-compat.parts.sha256
      - name: Publish audio-compat cargo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release/* --clobber

  receipt:
    needs: [analysis_public, builder_python, audio_main, audio_compat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Emit one corrected bulk receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_RESULT: ${{ needs.analysis_public.result }}
          BUILDER_PYTHON_RESULT: ${{ needs.builder_python.result }}
          AUDIO_MAIN_RESULT: ${{ needs.audio_main.result }}
          AUDIO_COMPAT_RESULT: ${{ needs.audio_compat.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ARMOURY_RECEIPTS
          ASSETS_JSON=''
          for n in 1 2 3 4 5 6 7; do
            ASSETS_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets 2>/dev/null)" && break
            sleep $((n * 5))
          done
          test -n "$ASSETS_JSON"
          python3 - "$RELEASE_TAG" "$GITHUB_RUN_ID" "$ANALYSIS_RESULT" "$BUILDER_PYTHON_RESULT" "$AUDIO_MAIN_RESULT" "$AUDIO_COMPAT_RESULT" "$ASSETS_JSON" <<'PY' > ARMOURY_RECEIPTS/FLP_ARMOURY_PUBLIC_BULK_LATEST.json
          import json,sys
          tag,run,an,bp,am,ac,assets_raw=sys.argv[1:]
          assets=json.loads(assets_raw).get('assets',[])
          jobs={'windows_public':'success (carried from first bulk pass)','analysis_public':an,'builder_python':bp,'audio_main':am,'audio_compat':ac}
          out={
            'schema':'mega-dan.flp-armoury-public-bulk.v2',
            'release_tag':tag,
            'run_id':run,
            'jobs':jobs,
            'assets':[{'name':a.get('name'),'size':a.get('size'),'url':a.get('url')} for a in assets],
            'scope':'public/open-source cargo only',
            'private_cargo_not_published':['private MEGA_DAN_TOOLBELT/FLP_BUILDER source (already in private GitHub North Star)','FL Studio installer','prepared/licensed FL Studio prefix'],
          }
          out['all_public_jobs_success']=all((v=='success' or str(v).startswith('success ')) for v in jobs.values())
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          cat ARMOURY_RECEIPTS/FLP_ARMOURY_PUBLIC_BULK_LATEST.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin master
          git add ARMOURY_RECEIPTS/FLP_ARMOURY_PUBLIC_BULK_LATEST.json
          git commit -m 'Receipt corrected FLP Armoury public bulk acquisition' || true
          git push
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ARMOURY_RECEIPTS/FLP_ARMOURY_PUBLIC_BULK_LATEST.json --clobber
