name: FLP4 Private Read Probe

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp4-private-read-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe private repository metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          code="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/I-am-MR-NATE/MEGA_DAN_TOOLBELT)"
          printf 'http_status=%s\n' "$code"
          python3 - <<'PY'
          import json
          try:
              obj=json.load(open('response.json'))
              print('repo_visible=' + str(obj.get('full_name') == 'I-am-MR-NATE/MEGA_DAN_TOOLBELT').lower())
              print('message=' + str(obj.get('message','')))
          except Exception as e:
              print('parse_error=' + repr(e))
          PY
          test "$code" = 200
