name: FLP6 Procmon Current Closeout

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp6-procmon-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procmon:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Acquire current official Process Monitor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE '_procmon'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'runtime') | Out-Null
          $zip=Join-Path $root 'ProcessMonitor.zip'
          Invoke-WebRequest -UseBasicParsing 'https://download.sysinternals.com/files/ProcessMonitor.zip' -OutFile $zip
          Expand-Archive -Force $zip (Join-Path $root 'runtime')
          $p=Get-Item (Join-Path $root 'runtime\Procmon64.exe')
          $v=$p.VersionInfo.ProductVersion
          if($v -notmatch '^4\.05'){throw "Expected current 4.05 after observed drift, got $v"}
          Get-ChildItem $root -File -Recurse | ForEach-Object {[pscustomobject]@{Relative=$_.FullName.Substring($root.Length).TrimStart('\');Bytes=$_.Length;SHA256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower();ProductVersion=$_.VersionInfo.ProductVersion}} | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $root 'FILES.json')
          "tool=procmon`nregistry_pin=4.04`ncurrent_official=4.05`nstatus=PIN_DRIFT_4.04_UNAVAILABLE_CURRENT_OFFICIAL_ACQUIRED`nsource=https://download.sysinternals.com/files/ProcessMonitor.zip`nrun_id=$env:GITHUB_RUN_ID" | Set-Content (Join-Path $root 'RECEIPT.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: flp6-ms-procmon-current-4.05
          path: _procmon
          retention-days: 1
          compression-level: 0
