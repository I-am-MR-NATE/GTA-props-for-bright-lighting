name: Worker08 Native FL Host Save Persistence

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Install official FL Studio and build locked control/candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $installer=Join-Path $env:RUNNER_TEMP 'flstudio-latest.exe'
          & curl.exe -L --fail --retry 2 --connect-timeout 30 -o $installer 'https://support.image-line.com/redirect/flstudio_win_installer'
          if($LASTEXITCODE -ne 0){throw "curl failed: $LASTEXITCODE"}
          $installerItem=Get-Item $installer
          if($installerItem.Length -lt 100MB){throw 'installer too small'}
          $installerHash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $ip=Start-Process -FilePath $installer -ArgumentList '/S','/ALLUSERS=1' -Wait -PassThru
          $fl=Get-ChildItem 'C:\Program Files\Image-Line' -Filter FL64.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $fl){throw "FL64 missing after installer exit $($ip.ExitCode)"}
          $flHash=(Get-FileHash $fl.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $src=Join-Path (Split-Path -Parent $fl.FullName) 'Data\Templates\Advanced\Electronic\Drum & Bass.flp'
          if(-not(Test-Path $src)){throw 'factory template missing'}
          $srcHash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          if($srcHash -ne '74b4b3fbab62a7e332c5087217ff7ea73a84b680424e015baa76e623216fde37'){throw "source hash mismatch $srcHash"}
          $control=Join-Path $env:RUNNER_TEMP 'worker08_control_save.flp'
          $candidate=Join-Path $env:RUNNER_TEMP 'worker08_candidate_save.flp'
          Copy-Item $src $control -Force
          Copy-Item $src $candidate -Force
          [byte[]]$bytes=[IO.File]::ReadAllBytes($candidate)
          $off=70076
          [byte[]]$expected=0x60,0x66,0x66,0xe2
          [byte[]]$replacement=0x00,0x00,0x00,0xd0
          for($i=0;$i -lt 4;$i++){if($bytes[$off+$i] -ne $expected[$i]){throw "unexpected byte at $($off+$i): $($bytes[$off+$i])"}}
          [Array]::Copy($replacement,0,$bytes,$off,4)
          [IO.File]::WriteAllBytes($candidate,$bytes)
          $candidateHash=(Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if($candidateHash -ne 'eb574ed41c7b1af3140d73b453661950524dadabec691c8d11393cad4bc63231'){throw "candidate hash mismatch $candidateHash"}
          "FL64_PATH=$($fl.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTROL_PATH=$control" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_PATH=$candidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_EXIT=$($ip.ExitCode)" | Out-File (Join-Path $env:RUNNER_TEMP 'install.txt') -Encoding ascii
          "INSTALLER_BYTES=$($installerItem.Length)" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "INSTALLER_SHA256=$installerHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "FL64_SHA256=$flHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "SOURCE_SHA256=$srcHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "CANDIDATE_SHA256=$candidateHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')

      - name: Candidate-first long save differential
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Stop-Fl { Get-Process FL64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 2 }
          function Shot([string]$p){$b=[Windows.Forms.SystemInformation]::VirtualScreen;$bmp=New-Object Drawing.Bitmap $b.Width,$b.Height;$g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Left,$b.Top,0,0,$bmp.Size);$bmp.Save($p,[Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()}
          function HexCount([byte[]]$hay,[byte[]]$needle){$n=0;for($i=0;$i -le $hay.Length-$needle.Length;$i++){$ok=$true;for($j=0;$j -lt $needle.Length;$j++){if($hay[$i+$j] -ne $needle[$j]){$ok=$false;break}};if($ok){$n++}};return $n}
          [byte[]]$oldValue=0x00,0x00,0x00,0x60,0x66,0x66,0xe2,0x3f
          [byte[]]$newValue=0x00,0x00,0x00,0x00,0x00,0x00,0xd0,0x3f
          function FileState([string]$path){
            if(-not(Test-Path $path)){return $null}
            $it=Get-Item $path; [byte[]]$b=[IO.File]::ReadAllBytes($path)
            [pscustomobject]@{sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant();bytes=$it.Length;last_write_utc=$it.LastWriteTimeUtc.ToString('o');old_value_count=(HexCount $b $oldValue);new_value_count=(HexCount $b $newValue)}
          }
          function ProcState {
            $ps=@(Get-Process FL64 -ErrorAction SilentlyContinue)
            if($ps.Count -eq 0){return $null}
            $p=$ps[0];$mods=@();try{$mods=@($p.Modules|ForEach-Object{$_.FileName}|Sort-Object -Unique)}catch{}
            [pscustomobject]@{id=$p.Id;responding=$p.Responding;title=$p.MainWindowTitle;cpu_seconds=$p.CPU;working_set=$p.WorkingSet64;module_count=$mods.Count;modules=$mods}
          }
          function Case([string]$name,[string]$project){
            Stop-Fl
            $backup=$project+'~'
            Remove-Item $backup -Force -ErrorAction SilentlyContinue
            $before=FileState $project
            $p=Start-Process $env:FL64_PATH -ArgumentList ('"'+$project+'"') -PassThru
            Start-Sleep 12
            $open=ProcState; Shot (Join-Path $env:RUNNER_TEMP "$name-open.png")
            $w=New-Object -ComObject WScript.Shell
            foreach($fp in @(Get-Process FL64 -ErrorAction SilentlyContinue)){[void]$w.AppActivate($fp.Id)}
            Start-Sleep -Milliseconds 500; $w.SendKeys('{ENTER}'); Start-Sleep 4
            $ready=ProcState; Shot (Join-Path $env:RUNNER_TEMP "$name-ready.png")
            foreach($fp in @(Get-Process FL64 -ErrorAction SilentlyContinue)){[void]$w.AppActivate($fp.Id)}
            Start-Sleep -Milliseconds 500; $w.SendKeys('^s')
            $timeline=@();$elapsed=0
            foreach($target in @(3,10,30,60,90)){
              $wait=$target-$elapsed; if($wait -gt 0){Start-Sleep $wait}; $elapsed=$target
              $state=[pscustomobject]@{seconds=$target;main=(FileState $project);backup=(FileState $backup);process=(ProcState)}
              $timeline += $state
              Shot (Join-Path $env:RUNNER_TEMP ("$name-save-{0:D2}s.png" -f $target))
            }
            $after=FileState $project; $backupFinal=FileState $backup
            $dir=@(Get-ChildItem (Split-Path -Parent $project) -File | Select-Object -ExpandProperty Name | Sort-Object)
            Stop-Fl
            $p2=Start-Process $env:FL64_PATH -ArgumentList ('"'+$project+'"') -PassThru
            Start-Sleep 12
            $reopen=ProcState; Shot (Join-Path $env:RUNNER_TEMP "$name-reopen.png")
            foreach($fp in @(Get-Process FL64 -ErrorAction SilentlyContinue)){[void]$w.AppActivate($fp.Id)}
            Start-Sleep -Milliseconds 500; $w.SendKeys('{ENTER}'); Start-Sleep 5
            $reopenAfter=ProcState; Shot (Join-Path $env:RUNNER_TEMP "$name-reopen-after-enter.png")
            Stop-Fl
            [pscustomobject]@{name=$name;before=$before;open_process=$open;ready_process=$ready;timeline=$timeline;after_90s=$after;backup_after_90s=$backupFinal;directory=$dir;reopen=$reopen;reopen_after_enter=$reopenAfter}
          }
          # Deliberately candidate first, reversing the prior run order to rule out first-run/second-run effects.
          $candidate=Case 'candidate' $env:CANDIDATE_PATH
          $control=Case 'control' $env:CONTROL_PATH
          $install=@{};Get-Content (Join-Path $env:RUNNER_TEMP 'install.txt')|ForEach-Object{$k,$v=$_.Split('=',2);$install[$k]=$v}
          $out=[ordered]@{schema='worker08.native-fl-host-save-persistence.v2';runner_os=[Environment]::OSVersion.VersionString;order=@('candidate','control');installer=$install;mutation=[ordered]@{source_sha256='74b4b3fbab62a7e332c5087217ff7ea73a84b680424e015baa76e623216fde37';candidate_sha256='eb574ed41c7b1af3140d73b453661950524dadabec691c8d11393cad4bc63231';semantic='automation channel 7 Bass Auto point index 1 value 0.574999988079071 -> 0.25'};candidate=$candidate;control=$control}
          $json=Join-Path $env:RUNNER_TEMP 'worker08-native-fl-host-save-persistence-v2.json';$out|ConvertTo-Json -Depth 12|Set-Content $json -Encoding utf8;Get-Content $json

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker08-native-fl-host-save-persistence-v2
          path: |
            ${{ runner.temp }}/worker08-native-fl-host-save-persistence-v2.json
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/candidate-*.png
            ${{ runner.temp }}/control-*.png
          if-no-files-found: warn
          retention-days: 1
