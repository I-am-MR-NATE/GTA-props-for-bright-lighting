name: Worker08 Native FL Host Save Persistence

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Install official FL Studio and build locked control/candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $installer=Join-Path $env:RUNNER_TEMP 'flstudio-latest.exe'
          & curl.exe -L --fail --retry 2 --connect-timeout 30 -o $installer 'https://support.image-line.com/redirect/flstudio_win_installer'
          if($LASTEXITCODE -ne 0){throw "curl failed: $LASTEXITCODE"}
          $installerItem=Get-Item $installer
          if($installerItem.Length -lt 100MB){throw "installer too small"}
          $installerHash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $ip=Start-Process -FilePath $installer -ArgumentList '/S','/ALLUSERS=1' -Wait -PassThru
          $fl=Get-ChildItem 'C:\Program Files\Image-Line' -Filter FL64.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $fl){throw "FL64 missing after installer exit $($ip.ExitCode)"}
          $flHash=(Get-FileHash $fl.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $src=Join-Path (Split-Path -Parent $fl.FullName) 'Data\Templates\Advanced\Electronic\Drum & Bass.flp'
          if(-not(Test-Path $src)){throw 'factory template missing'}
          $srcHash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          if($srcHash -ne '74b4b3fbab62a7e332c5087217ff7ea73a84b680424e015baa76e623216fde37'){throw "source hash mismatch $srcHash"}
          $control=Join-Path $env:RUNNER_TEMP 'worker08_control_save.flp'
          $candidate=Join-Path $env:RUNNER_TEMP 'worker08_candidate_save.flp'
          Copy-Item $src $control -Force
          Copy-Item $src $candidate -Force
          [byte[]]$bytes=[IO.File]::ReadAllBytes($candidate)
          $off=70076
          [byte[]]$expected=0x60,0x66,0x66,0xe2
          [byte[]]$replacement=0x00,0x00,0x00,0xd0
          for($i=0;$i -lt 4;$i++){if($bytes[$off+$i] -ne $expected[$i]){throw "unexpected byte at $($off+$i): $($bytes[$off+$i])"}}
          [Array]::Copy($replacement,0,$bytes,$off,4)
          [IO.File]::WriteAllBytes($candidate,$bytes)
          $candidateHash=(Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if($candidateHash -ne 'eb574ed41c7b1af3140d73b453661950524dadabec691c8d11393cad4bc63231'){throw "candidate hash mismatch $candidateHash"}
          "FL64_PATH=$($fl.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTROL_PATH=$control" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CANDIDATE_PATH=$candidate" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_EXIT=$($ip.ExitCode)" | Out-File (Join-Path $env:RUNNER_TEMP 'install.txt') -Encoding ascii
          "INSTALLER_BYTES=$($installerItem.Length)" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "INSTALLER_SHA256=$installerHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "FL64_SHA256=$flHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "SOURCE_SHA256=$srcHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')
          "CANDIDATE_SHA256=$candidateHash" | Add-Content (Join-Path $env:RUNNER_TEMP 'install.txt')

      - name: Capture Image-Line registry baseline
        shell: pwsh
        continue-on-error: true
        run: |
          cmd /c "reg query HKCU\Software\Image-Line /s" > "$env:RUNNER_TEMP\registry-before-hkcu.txt" 2>&1
          cmd /c "reg query HKLM\Software\Image-Line /s" > "$env:RUNNER_TEMP\registry-before-hklm.txt" 2>&1
          cmd /c "reg query HKLM\Software\WOW6432Node\Image-Line /s" > "$env:RUNNER_TEMP\registry-before-hklm32.txt" 2>&1

      - name: Native host-save control and Builder candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Stop-Fl { Get-Process FL64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 2 }
          function Shot([string]$p){
            $b=[Windows.Forms.SystemInformation]::VirtualScreen
            $bmp=New-Object Drawing.Bitmap $b.Width,$b.Height
            $g=[Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left,$b.Top,0,0,$bmp.Size)
            $bmp.Save($p,[Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose();$bmp.Dispose()
          }
          function HexCount([byte[]]$hay,[byte[]]$needle){
            $n=0
            for($i=0;$i -le $hay.Length-$needle.Length;$i++){
              $ok=$true
              for($j=0;$j -lt $needle.Length;$j++){if($hay[$i+$j] -ne $needle[$j]){$ok=$false;break}}
              if($ok){$n++}
            }
            return $n
          }
          function Snapshot([string]$project){
            $it=Get-Item $project
            [pscustomobject]@{sha256=(Get-FileHash $project -Algorithm SHA256).Hash.ToLowerInvariant();bytes=$it.Length;last_write_utc=$it.LastWriteTimeUtc.ToString('o')}
          }
          function ProcState {
            $ps=@(Get-Process FL64 -ErrorAction SilentlyContinue)
            @($ps|ForEach-Object{
              $mods=@()
              try{$mods=@($_.Modules|ForEach-Object{$_.FileName}|Sort-Object -Unique)}catch{}
              [pscustomobject]@{id=$_.Id;responding=$_.Responding;title=$_.MainWindowTitle;module_count=$mods.Count;modules=$mods}
            })
          }
          function RunCase([string]$name,[string]$project){
            Stop-Fl
            $before=Snapshot $project
            $dir=Split-Path -Parent $project
            $beforeNames=@(Get-ChildItem $dir -File | Select-Object -ExpandProperty Name | Sort-Object)
            $p=Start-Process $env:FL64_PATH -ArgumentList ('"'+$project+'"') -PassThru
            Start-Sleep 12
            $initial=ProcState
            Shot (Join-Path $env:RUNNER_TEMP "$name-open.png")
            $w=New-Object -ComObject WScript.Shell
            foreach($fp in @(Get-Process FL64 -ErrorAction SilentlyContinue)){[void]$w.AppActivate($fp.Id)}
            Start-Sleep -Milliseconds 500
            $w.SendKeys('{ENTER}')
            Start-Sleep 4
            $afterEnter=ProcState
            Shot (Join-Path $env:RUNNER_TEMP "$name-before-save.png")
            foreach($fp in @(Get-Process FL64 -ErrorAction SilentlyContinue)){[void]$w.AppActivate($fp.Id)}
            Start-Sleep -Milliseconds 500
            $w.SendKeys('^s')
            Start-Sleep 12
            $afterSaveUi=ProcState
            Shot (Join-Path $env:RUNNER_TEMP "$name-after-save.png")
            $after=Snapshot $project
            $afterNames=@(Get-ChildItem $dir -File | Select-Object -ExpandProperty Name | Sort-Object)
            [byte[]]$saved=[IO.File]::ReadAllBytes($project)
            [byte[]]$old=0x00,0x00,0x00,0x60,0x66,0x66,0xe2,0x3f
            [byte[]]$new=0x00,0x00,0x00,0x00,0x00,0x00,0xd0,0x3f
            $counts=[pscustomobject]@{old_value_double=(HexCount $saved $old);new_value_double=(HexCount $saved $new)}
            Stop-Fl
            $p2=Start-Process $env:FL64_PATH -ArgumentList ('"'+$project+'"') -PassThru
            Start-Sleep 12
            $reopenInitial=ProcState
            Shot (Join-Path $env:RUNNER_TEMP "$name-reopen-before-enter.png")
            foreach($fp in @(Get-Process FL64 -ErrorAction SilentlyContinue)){[void]$w.AppActivate($fp.Id)}
            Start-Sleep -Milliseconds 500
            $w.SendKeys('{ENTER}')
            Start-Sleep 5
            $reopenAfterEnter=ProcState
            Shot (Join-Path $env:RUNNER_TEMP "$name-reopen-after-enter.png")
            Stop-Fl
            [pscustomobject]@{
              name=$name;before=$before;after_save=$after;value_sequence_counts_after_save=$counts;
              initial_process=$initial;after_enter_process=$afterEnter;after_ctrl_s_process=$afterSaveUi;
              directory_before=$beforeNames;directory_after=$afterNames;
              clean_reopen_initial=$reopenInitial;clean_reopen_after_enter=$reopenAfterEnter
            }
          }
          $control=RunCase 'control' $env:CONTROL_PATH
          $candidate=RunCase 'candidate' $env:CANDIDATE_PATH
          $install=@{}
          Get-Content (Join-Path $env:RUNNER_TEMP 'install.txt') | ForEach-Object { $k,$v=$_.Split('=',2);$install[$k]=$v }
          $out=[ordered]@{
            schema='worker08.native-fl-host-save-persistence.v1';
            runner_os=[Environment]::OSVersion.VersionString;
            installer=$install;
            mutation=[ordered]@{source_sha256='74b4b3fbab62a7e332c5087217ff7ea73a84b680424e015baa76e623216fde37';candidate_sha256='eb574ed41c7b1af3140d73b453661950524dadabec691c8d11393cad4bc63231';semantic='automation channel 7 Bass Auto point index 1 value 0.574999988079071 -> 0.25';changed_offsets=@(70076,70077,70078,70079);before_hex='606666e2';after_hex='000000d0'};
            control=$control;candidate=$candidate
          }
          $json=Join-Path $env:RUNNER_TEMP 'worker08-native-fl-host-save-persistence.json'
          $out|ConvertTo-Json -Depth 10|Set-Content $json -Encoding utf8
          Get-Content $json

      - name: Capture Image-Line registry after experiment
        shell: pwsh
        continue-on-error: true
        run: |
          cmd /c "reg query HKCU\Software\Image-Line /s" > "$env:RUNNER_TEMP\registry-after-hkcu.txt" 2>&1
          cmd /c "reg query HKLM\Software\Image-Line /s" > "$env:RUNNER_TEMP\registry-after-hklm.txt" 2>&1
          cmd /c "reg query HKLM\Software\WOW6432Node\Image-Line /s" > "$env:RUNNER_TEMP\registry-after-hklm32.txt" 2>&1
          Compare-Object (Get-Content "$env:RUNNER_TEMP\registry-before-hkcu.txt") (Get-Content "$env:RUNNER_TEMP\registry-after-hkcu.txt") | Out-File "$env:RUNNER_TEMP\registry-hkcu-diff.txt"
          Compare-Object (Get-Content "$env:RUNNER_TEMP\registry-before-hklm.txt") (Get-Content "$env:RUNNER_TEMP\registry-after-hklm.txt") | Out-File "$env:RUNNER_TEMP\registry-hklm-diff.txt"
          Compare-Object (Get-Content "$env:RUNNER_TEMP\registry-before-hklm32.txt") (Get-Content "$env:RUNNER_TEMP\registry-after-hklm32.txt") | Out-File "$env:RUNNER_TEMP\registry-hklm32-diff.txt"

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker08-native-fl-host-save-persistence
          path: |
            ${{ runner.temp }}/worker08-native-fl-host-save-persistence.json
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/registry-*.txt
            ${{ runner.temp }}/control-*.png
            ${{ runner.temp }}/candidate-*.png
          if-no-files-found: warn
          retention-days: 1
