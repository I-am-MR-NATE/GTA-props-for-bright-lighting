name: FLP Wine 11.0 x86 Ferry 20260818

on:
  pull_request:
    branches: [master]
    paths:
      - '.flp-wine11-x86-ferry-trigger'

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch and verify exact Wine 11.0 x86
        shell: bash
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/wine11-x86-ferry"
          mkdir -p "$work"
          url='https://github.com/Kron4ek/Wine-Builds/releases/download/11.0/wine-11.0-x86.tar.xz'
          expected='025476351cd9c0f76a18e3b65fd9c6a9d8f70215071d179fd78e344590d39c5e'
          curl -fL --retry 4 --retry-delay 2 "$url" -o "$work/wine-11.0-x86.tar.xz"
          actual="$(sha256sum "$work/wine-11.0-x86.tar.xz" | awk '{print $1}')"
          bytes="$(stat -c %s "$work/wine-11.0-x86.tar.xz")"
          test "$actual" = "$expected"
          tar -tJf "$work/wine-11.0-x86.tar.xz" >/dev/null
          printf 'url=%s\nbytes=%s\nsha256=%s\nrun_id=%s\nhead=%s\n' "$url" "$bytes" "$actual" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$work/RECEIPT.txt"
      - name: Upload exact Wine x86 payload
        uses: actions/upload-artifact@v4
        with:
          name: flp-wine-11.0-x86
          path: |
            ${{ runner.temp }}/wine11-x86-ferry/wine-11.0-x86.tar.xz
            ${{ runner.temp }}/wine11-x86-ferry/RECEIPT.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
