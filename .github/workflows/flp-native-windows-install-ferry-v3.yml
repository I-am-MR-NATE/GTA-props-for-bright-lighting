name: FLP Native Windows Install Ferry V3 SYSTEM

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp-native-windows-install-ferry-v3.yml'

permissions:
  contents: read

jobs:
  install-pack-system:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Download and verify exact FL Studio installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work='C:\flp-native-ferry-v3'
          New-Item -ItemType Directory -Force -Path $work,"$work\meta","$work\parts" | Out-Null
          $installer="$work\flstudio-latest.exe"
          $url='https://support.image-line.com/redirect/flstudio_win_installer'
          & curl.exe -fL --retry 6 --retry-all-errors --connect-timeout 30 --max-time 3600 -A 'MEGA-DAN-FLP-Builder/1.0' $url -o $installer
          if ($LASTEXITCODE -ne 0) { throw "curl failed $LASTEXITCODE" }
          $bytes=(Get-Item $installer).Length
          $sha=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bytes -ne 1107195744) { throw "unexpected installer bytes $bytes" }
          if ($sha -ne '365e4210cad9e7fa8d1f0c1941fb2d629e45cc56232d1403bd478f941ebf0ee3') { throw "installer SHA mismatch $sha" }
          Set-Content "$work\meta\INSTALLER.txt" "bytes=$bytes`nsha256=$sha`nsource=$url"

      - name: Execute installer as LocalSystem with highest privileges
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work='C:\flp-native-ferry-v3'
          $cmd="$work\install-system.cmd"
          @"
          @echo off
          "C:\flp-native-ferry-v3\flstudio-latest.exe" /S
          echo %ERRORLEVEL%>C:\flp-native-ferry-v3\installer-exit.txt
          "@ | Set-Content -Encoding ascii $cmd
          schtasks.exe /Create /TN FLPBuilderInstall /TR "C:\flp-native-ferry-v3\install-system.cmd" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "schtasks create failed $LASTEXITCODE" }
          schtasks.exe /Run /TN FLPBuilderInstall | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "schtasks run failed $LASTEXITCODE" }
          $deadline=(Get-Date).AddMinutes(20)
          do {
            Start-Sleep -Seconds 5
            $fl=Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Filter FL64.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($fl) { break }
            if (Test-Path "$work\installer-exit.txt") {
              $rc=(Get-Content "$work\installer-exit.txt" -Raw).Trim()
              if ($rc -ne '0') { throw "SYSTEM installer exit $rc" }
            }
          } while ((Get-Date) -lt $deadline)
          if (-not $fl) { throw 'FL64.exe not found after SYSTEM install' }
          $root=$fl.FullName
          while ((Split-Path $root -Leaf) -notmatch '^Image-Line$' -and (Split-Path $root -Parent)) { $root=Split-Path $root -Parent }
          if ((Split-Path $root -Leaf) -notmatch '^Image-Line$') { $root=Split-Path $fl.FullName -Parent }
          $flSha=(Get-FileHash $fl.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $vi=(Get-Item $fl.FullName).VersionInfo
          $engine=Get-ChildItem $root -Filter FLEngine_x64.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $engineSha=if($engine){(Get-FileHash $engine.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}else{''}
          @(
            "image_line_root=$root",
            "fl64_path=$($fl.FullName)",
            "fl64_sha256=$flSha",
            "file_version=$($vi.FileVersion)",
            "product_version=$($vi.ProductVersion)",
            "engine_path=$($engine.FullName)",
            "engine_sha256=$engineSha",
            "run_id=$env:GITHUB_RUN_ID",
            "head=$env:GITHUB_SHA"
          ) | Set-Content "$work\meta\RECEIPT.txt"
          Set-Content "$work\meta\IMAGE_LINE_ROOT.txt" $root
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            $rel=$_.FullName.Substring($root.Length).TrimStart('\')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $rel"
          } | Set-Content "$work\meta\FILE_SHA256SUMS.txt"
          schtasks.exe /Delete /TN FLPBuilderInstall /F | Out-Null

      - name: Pack installed Image-Line tree into 300 MiB volumes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work='C:\flp-native-ferry-v3'
          $root=(Get-Content "$work\meta\IMAGE_LINE_ROOT.txt" -Raw).Trim()
          $seven='C:\Program Files\7-Zip\7z.exe'
          & $seven a -t7z -mx=1 -v300m "$work\parts\flstudio-installed.7z" "$root\*"
          if ($LASTEXITCODE -ne 0) { throw "7z exit $LASTEXITCODE" }
          $parts=Get-ChildItem "$work\parts\flstudio-installed.7z.*" | Sort-Object Name
          if (-not $parts) { throw 'no archive parts' }
          if ($parts.Count -gt 12) { throw "too many parts $($parts.Count)" }
          $parts | ForEach-Object { "$($_.Name)`t$($_.Length)" } | Set-Content "$work\meta\PART_BYTES.tsv"
          $parts | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content "$work\meta\PART_SHA256SUMS.txt"
          $parts.Name | Set-Content "$work\meta\PART_ORDER.txt"
          Set-Content "$work\meta\PART_COUNT.txt" $parts.Count

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: flp-native-v3-meta
          path: C:\flp-native-ferry-v3\meta
          retention-days: 1
      - name: Upload part 001
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-001, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.001', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 002
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-002, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.002', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 003
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-003, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.003', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 004
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-004, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.004', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 005
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-005, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.005', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 006
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-006, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.006', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 007
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-007, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.007', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 008
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-008, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.008', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 009
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-009, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.009', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 010
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-010, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.010', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 011
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-011, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.011', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
      - name: Upload part 012
        uses: actions/upload-artifact@v4
        with: {name: flp-native-v3-part-012, path: 'C:\flp-native-ferry-v3\parts\flstudio-installed.7z.012', compression-level: 0, retention-days: 1, if-no-files-found: ignore}
