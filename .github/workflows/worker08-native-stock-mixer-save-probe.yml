name: Worker08 Native Stock Mixer Save Probe

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/worker08-native-stock-mixer-save-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\worker08" | Out-Null

      - name: Download and install current official FL Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:RUNNER_TEMP\worker08"
          $installer = "$out\flstudio-latest.exe"
          curl.exe -L --fail --retry 6 --retry-all-errors --connect-timeout 30 --max-time 3600 -A "MEGA-DAN-FLP-Builder/1.0" -o "$installer" "https://support.image-line.com/redirect/flstudio_win_installer"
          $bytes = (Get-Item $installer).Length
          if ($bytes -lt 100MB) { throw "installer too small: $bytes" }
          $head = [System.IO.File]::ReadAllBytes($installer)[0..1]
          if ($head[0] -ne 0x4d -or $head[1] -ne 0x5a) { throw 'installer missing MZ' }
          $ih = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          $fl = 'C:\Program Files\Image-Line\FL Studio 2026\FL64.exe'
          for ($i=0; $i -lt 30 -and -not (Test-Path $fl); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $fl)) { throw 'FL64.exe absent after installer' }
          $fh = (Get-FileHash -Algorithm SHA256 $fl).Hash.ToLowerInvariant()
          "installer_bytes=$bytes`ninstaller_sha256=$ih`ninstaller_exit_code=$($p.ExitCode)`nfl64_path=$fl`nfl64_sha256=$fh" | Set-Content -Encoding UTF8 "$out\install.txt"
          "FL64_PATH=$fl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FL64_SHA256=$fh" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reproduce exact established Builder stock-mixer oracle from installed Basic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:RUNNER_TEMP\worker08"
          $source = 'C:\Program Files\Image-Line\FL Studio 2026\Data\Templates\Minimal\Basic\Basic.flp'
          if (-not (Test-Path $source)) { throw 'stock Basic.flp missing' }
          $env:W08_SOURCE = $source
          $env:W08_CANDIDATE = "$out\builder-oracle-stock-mixer.flp"
          @'
          import hashlib, json, os, struct
          from pathlib import Path

          SOURCE_EXPECTED='c8a7a05cf39dcf8489a9cd67e31024602fe0dd910fcb941d52ca27ddb35c907f'
          CAND_EXPECTED='1f02dc0bb824b1141e5f2fa9ccd1bb8f9c20bc35a01b7a16ff123c2ccd007ff2'

          def read_varint(buf, pos):
              value=0; shift=0; start=pos
              while True:
                  b=buf[pos]; pos+=1
                  value |= (b & 0x7f) << shift
                  if not (b & 0x80): return value, pos, buf[start:pos]
                  shift += 7
                  if shift > 35: raise ValueError('varint too long')

          def enc_varint(value):
              out=bytearray()
              while True:
                  b=value & 0x7f; value >>= 7
                  if value: out.append(b|0x80)
                  else: out.append(b); return bytes(out)

          def parse_events(payload):
              ev=[]; pos=0; idx=0
              while pos < len(payload):
                  start=pos; eid=payload[pos]; pos+=1
                  if eid < 64: n=1; lp=b''
                  elif eid < 128: n=2; lp=b''
                  elif eid < 192: n=4; lp=b''
                  else: n,pos,lp=read_varint(payload,pos)
                  ps=pos; pe=pos+n
                  if pe > len(payload): raise ValueError(f'event {idx} overruns stream')
                  ev.append({'index':idx,'id':eid,'start':start,'payload_start':ps,'payload_end':pe,'payload_len':n,'len_prefix':lp})
                  pos=pe; idx+=1
              return ev

          src=Path(os.environ['W08_SOURCE']).read_bytes()
          sh=hashlib.sha256(src).hexdigest()
          if sh != SOURCE_EXPECTED: raise SystemExit(f'stock Basic hash changed: {sh}')
          if src[:4] != b'FLhd': raise SystemExit('no FLhd')
          hlen=struct.unpack_from('<I',src,4)[0]
          dt=8+hlen
          if src[dt:dt+4] != b'FLdt': raise SystemExit('no FLdt')
          dlen=struct.unpack_from('<I',src,dt+4)[0]
          payload=bytearray(src[dt+8:dt+8+dlen])
          events=parse_events(payload)
          m=[e for e in events if e['id']==225 and e['payload_len']==6924]
          if len(m)!=1: raise SystemExit(f'expected one 6924-byte event225, got {[(e["index"],e["payload_len"]) for e in m]}')
          me=m[0]
          mp=bytearray(payload[me['payload_start']:me['payload_end']])
          struct.pack_into('<i',mp,636+8,9000)
          struct.pack_into('<i',mp,648+8,3200)
          payload[me['payload_start']:me['payload_end']]=mp
          events=parse_events(payload)
          candidates=[]
          for i in (1252,1251):
              if 0 <= i < len(events):
                  e=events[i]
                  raw=bytes(payload[e['payload_start']:e['payload_end']])
                  candidates.append((i,e['id'],raw.hex()))
          route_index=None
          for i in (1252,1251):
              if 0 <= i < len(events):
                  e=events[i]
                  if e['id']==235 and bytes(payload[e['payload_start']:e['payload_end']])==b'\x01':
                      route_index=i; break
          if route_index is None: raise SystemExit(f'route event not found at pinned index neighborhood: {candidates}')
          e=events[route_index]
          replacement=bytes([235])+enc_varint(3)+bytes([1,0,1])
          payload=payload[:e['start']]+replacement+payload[e['payload_end']:]
          out=src[:dt+4]+struct.pack('<I',len(payload))+bytes(payload)+src[dt+8+dlen:]
          ch=hashlib.sha256(out).hexdigest()
          Path(os.environ['W08_CANDIDATE']).write_bytes(out)
          info={'source_sha256':sh,'source_bytes':len(src),'source_events':len(events),'mixer_event_index':me['index'],'mixer_payload_bytes':me['payload_len'],'route_event_index':route_index,'route_before_hex':'01','route_after_hex':'010001','candidate_sha256':ch,'candidate_bytes':len(out),'candidate_expected_sha256':CAND_EXPECTED,'candidate_identity_match':ch==CAND_EXPECTED}
          Path(os.path.join(os.environ['RUNNER_TEMP'],'worker08','oracle-build.json')).write_text(json.dumps(info,indent=2)+'\n')
          if ch != CAND_EXPECTED: raise SystemExit(f'candidate hash mismatch: {ch}')
          '@ | Set-Content -Encoding UTF8 "$out\build_oracle.py"
          python "$out\build_oracle.py"
          "CANDIDATE_PATH=$env:W08_CANDIDATE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Decode exact Builder oracle before FL
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\worker08"
          $env:W08_DECODE_TARGET = $env:CANDIDATE_PATH
          @'
          import hashlib,json,os,struct
          from pathlib import Path

          def rv(buf,pos):
              v=0;s=0
              while True:
                  b=buf[pos];pos+=1;v|=(b&127)<<s
                  if not b&128:return v,pos
                  s+=7
          def events(data):
              h=struct.unpack_from('<I',data,4)[0];dt=8+h;dl=struct.unpack_from('<I',data,dt+4)[0];p=data[dt+8:dt+8+dl];out=[];pos=0;i=0
              while pos<len(p):
                  eid=p[pos];pos+=1
                  if eid<64:n=1
                  elif eid<128:n=2
                  elif eid<192:n=4
                  else:n,pos=rv(p,pos)
                  out.append((i,eid,p[pos:pos+n]));pos+=n;i+=1
              return out
          def text(raw):
              for enc in ('utf-8','utf-16le','cp1252'):
                  try:return raw.decode(enc).rstrip('\x00')
                  except:pass
              return raw.hex()
          def summarize(path):
              d=Path(path).read_bytes();ev=events(d);mix=next(x for x in ev if x[1]==225 and len(x[2])%12==0 and len(x[2])>1000);recs=[]
              for off in range(0,len(mix[2]),12):
                  prefix,pid,unk,ch,val=struct.unpack_from('<4sBBHi',mix[2],off);recs.append((pid,unk,ch,val))
              banks=[]
              for pid,unk,ch,val in recs:
                  bank=ch&0xffc0
                  if pid==192 and bank not in banks:banks.append(bank)
              bank=banks[1]
              vals={pid:val for pid,unk,ch,val in recs if (ch&0xffc0)==bank and unk==31 and pid in (192,193)}
              routes=[x[2].hex() for x in ev if x[1]==235]
              ids={}
              for _,eid,_ in ev:ids[eid]=ids.get(eid,0)+1
              get=lambda eid:[x[2] for x in ev if x[1]==eid]
              return {'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d),'events':len(ev),'id_counts':ids,'event159':[int.from_bytes(x,'little') for x in get(159)],'event192':[text(x) for x in get(192)],'event199':[text(x) for x in get(199)],'insert1_volume':vals.get(192),'insert1_pan':vals.get(193),'routing235_hex':routes[:20]}
          s=summarize(os.environ['W08_DECODE_TARGET']);Path(os.path.join(os.environ['RUNNER_TEMP'],'worker08','oracle-decode.json')).write_text(json.dumps(s,indent=2)+'\n')
          '@ | Set-Content -Encoding UTF8 "$out\decode.py"
          python "$out\decode.py"

      - name: Capture registry before FL runtime
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP\worker08"
          cmd /c "reg query HKCU\Software\Image-Line /s" *> "$out\registry-before.txt"
          if (-not (Test-Path "$out\registry-before.txt")) { '' | Set-Content "$out\registry-before.txt" }

      - name: Open exact Builder oracle, save through FL, and observe runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $out="$env:RUNNER_TEMP\worker08"; $fl=$env:FL64_PATH; $candidate=$env:CANDIDATE_PATH
          function Shot([string]$p){try{$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$bm=New-Object System.Drawing.Bitmap $b.Width,$b.Height;$g=[System.Drawing.Graphics]::FromImage($bm);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bm.Save($p,[System.Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bm.Dispose()}catch{$_|Out-String|Set-Content ($p+'.error.txt')}}
          Get-Process FL64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $beforeHash=(Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant();$beforeTime=(Get-Item $candidate).LastWriteTimeUtc.ToString('o')
          $p=Start-Process -FilePath $fl -ArgumentList ('"'+$candidate+'"') -PassThru
          Start-Sleep 18;$p.Refresh();Shot "$out\open-before-enter.png"
          $ws=New-Object -ComObject WScript.Shell;[void]$ws.AppActivate($p.Id);Start-Sleep 1;[System.Windows.Forms.SendKeys]::SendWait('{ENTER}');Start-Sleep 5;$p.Refresh();Shot "$out\open-after-enter.png"
          try{Get-Process -Id $p.Id -Module|Select ModuleName,FileName,FileVersion|Sort ModuleName|Format-Table -AutoSize|Out-String -Width 500|Set-Content -Encoding UTF8 "$out\fl-modules-before-save.txt"}catch{$_|Out-String|Set-Content "$out\fl-modules-before-save-error.txt"}
          [void]$ws.AppActivate($p.Id);Start-Sleep 1;[System.Windows.Forms.SendKeys]::SendWait('^s');Start-Sleep 4;Shot "$out\save-dialog.png";[System.Windows.Forms.SendKeys]::SendWait('{ENTER}');Start-Sleep 4;[System.Windows.Forms.SendKeys]::SendWait('{ENTER}');Start-Sleep 8;$p.Refresh();Shot "$out\after-save.png"
          $afterHash=(Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant();$afterTime=(Get-Item $candidate).LastWriteTimeUtc.ToString('o')
          [pscustomobject]@{pid=$p.Id;title=$p.MainWindowTitle;responding=$p.Responding;before_sha256=$beforeHash;after_sha256=$afterHash;before_write_utc=$beforeTime;after_write_utc=$afterTime;bytes=(Get-Item $candidate).Length;save_changed_bytes=($beforeHash -ne $afterHash)}|ConvertTo-Json|Set-Content -Encoding UTF8 "$out\save-observation.json"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;Start-Sleep 3

      - name: Decode FL-saved bytes and clean-reopen
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $out="$env:RUNNER_TEMP\worker08";$env:W08_DECODE_TARGET=$env:CANDIDATE_PATH
          python "$out\decode.py"
          if (Test-Path "$out\oracle-decode.json") { Move-Item "$out\oracle-decode.json" "$out\fl-saved-decode.json" -Force }
          Add-Type -AssemblyName System.Windows.Forms;Add-Type -AssemblyName System.Drawing
          $fl=$env:FL64_PATH;$candidate=$env:CANDIDATE_PATH
          $p=Start-Process -FilePath $fl -ArgumentList ('"'+$candidate+'"') -PassThru;Start-Sleep 18;$p.Refresh()
          try{$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds;$bm=New-Object System.Drawing.Bitmap $b.Width,$b.Height;$g=[System.Drawing.Graphics]::FromImage($bm);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size);$bm.Save("$out\clean-reopen.png",[System.Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bm.Dispose()}catch{}
          [pscustomobject]@{pid=$p.Id;title=$p.MainWindowTitle;responding=$p.Responding;sha256=(Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant()}|ConvertTo-Json|Set-Content -Encoding UTF8 "$out\clean-reopen.json"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;Start-Sleep 2

      - name: Capture registry diff and evidence hashes
        if: always()
        shell: pwsh
        run: |
          $out="$env:RUNNER_TEMP\worker08"
          cmd /c "reg query HKCU\Software\Image-Line /s" *> "$out\registry-after.txt"
          if (-not (Test-Path "$out\registry-after.txt")) { '' | Set-Content "$out\registry-after.txt" }
          Compare-Object (Get-Content "$out\registry-before.txt") (Get-Content "$out\registry-after.txt") | Out-String -Width 500 | Set-Content -Encoding UTF8 "$out\registry-diff.txt"
          Get-ChildItem $out -File|ForEach-Object{"$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"}|Set-Content -Encoding UTF8 "$out\SHA256SUMS.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker08-native-stock-mixer-save-probe
          path: ${{ runner.temp }}/worker08
          retention-days: 30
          if-no-files-found: error
