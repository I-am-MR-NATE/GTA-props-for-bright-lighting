name: FLP8 FLP Foundry Portable Python Runtime

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp8-wine11-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Pedalboard build requirements
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libsndfile1-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxrender-dev libxcomposite-dev libxcursor-dev libfreetype6-dev \
            libasound2-dev

      - name: Download exact FLP Foundry v0.7.0 runtime closure
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _runtime/wheels _runtime/source
          cat > _runtime/requirements-authoritative.txt <<'EOF'
          luaparser>=3.3.1,<4
          mido>=1.3.3,<2
          pedalboard>=0.9.24,<0.10
          pefile>=2024.8.26,<2025
          psutil>=6.1,<8
          EOF
          python -m pip download --dest _runtime/wheels -r _runtime/requirements-authoritative.txt
          rm -f _runtime/wheels/pedalboard-0.9.24-*.whl
          git clone --branch v0.9.24 --depth 1 --recurse-submodules https://github.com/spotify/pedalboard.git _runtime/source/pedalboard
          git -C _runtime/source/pedalboard rev-parse HEAD > _runtime/PEDALBOARD_SOURCE_COMMIT.txt
          git -C _runtime/source/pedalboard submodule status --recursive > _runtime/PEDALBOARD_SUBMODULES.txt

      - name: Build exact Pedalboard 0.9.24 with portable SIMD baseline
        shell: bash
        env:
          USE_PORTABLE_SIMD: '1'
          CFLAGS: '-O2 -mavx'
          CXXFLAGS: '-O2 -mavx'
        run: |
          set -Eeuo pipefail
          python -m pip wheel --no-deps --wheel-dir _runtime/wheels _runtime/source/pedalboard | tee _runtime/PEDALBOARD_BUILD.txt
          python - <<'PY'
          import glob, zipfile
          wheel=glob.glob('_runtime/wheels/pedalboard-0.9.24-*.whl')[0]
          with zipfile.ZipFile(wheel) as z:
              so=[n for n in z.namelist() if n.endswith('.so') and 'pedalboard_native' in n][0]
              open('_runtime/PEDALBOARD_NATIVE_MEMBER.txt','w').write(so+'\n')
          PY

      - name: Hash final armory and prove fully offline use
        shell: bash
        run: |
          set -Eeuo pipefail
          python --version > _runtime/PYTHON_VERSION.txt 2>&1
          python -m pip --version > _runtime/PIP_VERSION.txt
          find _runtime/wheels -maxdepth 1 -type f -printf '%f\n' | sort > _runtime/WHEEL_FILES.txt
          sha256sum _runtime/wheels/* | sort -k2 > _runtime/SHA256SUMS.txt
          printf 'run_id=%s\nrun_attempt=%s\nhead=%s\nportable_simd=USE_PORTABLE_SIMD=1 -mavx\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > _runtime/RECEIPT.txt
          python -m venv _proof_venv
          _proof_venv/bin/python -m pip install --no-index --find-links _runtime/wheels -r _runtime/requirements-authoritative.txt | tee _runtime/OFFLINE_INSTALL.txt
          _proof_venv/bin/python -m pip check | tee _runtime/PIP_CHECK.txt
          _proof_venv/bin/python - <<'PY' | tee _runtime/IMPORT_PROOF.txt
          import importlib.metadata as m
          for mod in ('luaparser','mido','pedalboard','pefile','psutil'):
              __import__(mod)
              print(mod, m.version(mod))
          PY

      - name: Upload verified portable runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: flp8-flp-foundry-v0.7.0-python313-portable-runtime
          path: _runtime
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
