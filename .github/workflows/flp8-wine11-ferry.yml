name: FLP8 FLP Foundry Python Runtime Ferry

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp8-wine11-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download exact FLP Foundry v0.7.0 runtime dependency closure
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _runtime/wheels
          cat > _runtime/requirements-authoritative.txt <<'EOF'
          luaparser>=3.3.1,<4
          mido>=1.3.3,<2
          pedalboard>=0.9.24,<0.10
          pefile>=2024.8.26,<2025
          psutil>=6.1,<8
          EOF
          python -m pip download --dest _runtime/wheels -r _runtime/requirements-authoritative.txt
          python -m pip --version > _runtime/PIP_VERSION.txt
          python --version > _runtime/PYTHON_VERSION.txt 2>&1
          find _runtime/wheels -maxdepth 1 -type f -printf '%f\n' | sort > _runtime/WHEEL_FILES.txt
          sha256sum _runtime/wheels/* | sort -k2 > _runtime/SHA256SUMS.txt
          printf 'run_id=%s\nrun_attempt=%s\nhead=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > _runtime/RECEIPT.txt

      - name: Prove clean offline install and record per-module imports
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m venv _proof_venv
          _proof_venv/bin/python -m pip install --no-index --find-links _runtime/wheels -r _runtime/requirements-authoritative.txt | tee _runtime/OFFLINE_INSTALL.txt
          _proof_venv/bin/python -m pip check | tee _runtime/PIP_CHECK.txt
          : > _runtime/IMPORT_PROOF.txt
          for mod in luaparser mido pedalboard pefile psutil; do
            set +e
            _proof_venv/bin/python -c "import ${mod}; import importlib.metadata as m; print('${mod}', m.version('${mod}'))" >> _runtime/IMPORT_PROOF.txt 2>&1
            rc=$?
            set -e
            printf '%s rc=%s\n' "$mod" "$rc" | tee -a _runtime/IMPORT_PROOF.txt
          done

      - name: Upload verified runtime artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flp8-flp-foundry-v0.7.0-python313-runtime
          path: _runtime
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
