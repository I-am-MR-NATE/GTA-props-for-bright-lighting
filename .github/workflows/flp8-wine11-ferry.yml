name: FLP8 Runtime Helper Ferry

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp8-wine11-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify 7-Zip 26.02 Linux x64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _helper
          file='7z2602-linux-x64.tar.xz'
          url="https://github.com/ip7z/7zip/releases/download/26.02/${file}"
          expected='41aaba7b1235304ab5aa0624530c67ae829496cd29e875925271efdccc28c03e'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            --user-agent 'MEGA-DAN-FLP8/1.0' "$url" -o "_helper/${file}"
          actual="$(sha256sum "_helper/${file}" | awk '{print $1}')"
          test "$actual" = "$expected"
          bytes="$(stat -c %s "_helper/${file}")"
          file "_helper/${file}" | tee _helper/FILE_IDENTITY.txt
          tar -tJf "_helper/${file}" > _helper/ARCHIVE_LIST.txt
          printf '%s  %s\n' "$actual" "$file" > _helper/SHA256SUMS.txt
          printf 'source=%s\nexpected_sha256=%s\nobserved_sha256=%s\nbytes=%s\nrun_id=%s\nrun_attempt=%s\nhead=%s\n' \
            "$url" "$expected" "$actual" "$bytes" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > _helper/RECEIPT.txt

      - name: Upload verified helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: flp8-7zip-26.02-linux-x64
          path: _helper
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
