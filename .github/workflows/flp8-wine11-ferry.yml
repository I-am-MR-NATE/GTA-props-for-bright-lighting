name: FLP8 Wine 11.0 Runtime Ferry

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp8-wine11-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and verify exact Wine 11.0 WoW64 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _wine
          url='https://github.com/Kron4ek/Wine-Builds/releases/download/11.0/wine-11.0-amd64-wow64.tar.xz'
          expected='39574efa1132c3ca0d5c77dd2eddbe4a49cca0d6cc2c290ff4924493a1c40314'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            --user-agent 'MEGA-DAN-FLP8/1.0' "$url" -o _wine/wine-11.0-amd64-wow64.tar.xz
          actual="$(sha256sum _wine/wine-11.0-amd64-wow64.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected"
          bytes="$(stat -c %s _wine/wine-11.0-amd64-wow64.tar.xz)"
          file _wine/wine-11.0-amd64-wow64.tar.xz | tee _wine/FILE_IDENTITY.txt
          tar -tJf _wine/wine-11.0-amd64-wow64.tar.xz | sed -n '1,25p' > _wine/ARCHIVE_HEAD.txt
          printf '%s  %s\n' "$actual" 'wine-11.0-amd64-wow64.tar.xz' > _wine/SHA256SUMS.txt
          printf 'source=%s\nexpected_sha256=%s\nobserved_sha256=%s\nbytes=%s\nrun_id=%s\nrun_attempt=%s\nhead=%s\n' \
            "$url" "$expected" "$actual" "$bytes" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > _wine/RECEIPT.txt

      - name: Upload exact Wine runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: flp8-wine-11.0-amd64-wow64
          path: _wine
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
