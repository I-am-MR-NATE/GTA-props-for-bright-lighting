name: FLP 7-Zip Ferry

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp-7zip-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ferry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify 7-Zip 26.02 Linux x64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _tool
          url='https://7-zip.org/a/7z2602-linux-x64.tar.xz'
          expected='41aaba7b1235304ab5aa0624530c67ae829496cd29e875925271efdccc28c03e'
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
            --user-agent 'MEGA-DAN-FLP-Builder/1.0' "$url" -o _tool/7z2602-linux-x64.tar.xz
          actual="$(sha256sum _tool/7z2602-linux-x64.tar.xz | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xf _tool/7z2602-linux-x64.tar.xz -C _tool
          test -x _tool/7zz
          _tool/7zz i | head -20 > _tool/IDENTITY.txt || true
          sha256sum _tool/7z2602-linux-x64.tar.xz > _tool/SHA256SUMS.txt

      - name: Upload 7-Zip
        uses: actions/upload-artifact@v4
        with:
          name: flp-7zip-linux-x64
          path: _tool
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
