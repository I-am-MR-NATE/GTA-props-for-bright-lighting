name: FLP6 Wave1 Wine LIEF Ferry

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp6-wave1-open-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Acquire exact Wine 11.0 source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/_closeout/wine"
          mkdir -p "$root/source" "$root/receipt"
          pin='db11d0fe6a169c457e23d007e20404643d067aa8'
          git init -q "$root/repo"
          git -C "$root/repo" remote add origin https://github.com/wine-mirror/wine.git
          git -C "$root/repo" fetch -q --depth=1 origin "$pin"
          git -C "$root/repo" checkout -q --detach FETCH_HEAD
          actual="$(git -C "$root/repo" rev-parse HEAD)"
          tree="$(git -C "$root/repo" rev-parse 'HEAD^{tree}')"
          test "$actual" = "$pin"
          git -C "$root/repo" archive --format=tar "$pin" | gzip -9 > "$root/source/wine-${pin}.tar.gz"
          git -C "$root/repo" ls-tree -r --full-tree "$pin" > "$root/receipt/GIT_TREE.txt"
          git -C "$root/repo" submodule status --recursive > "$root/receipt/SUBMODULE_STATUS.txt" 2>&1 || true
          find "$root/repo" -maxdepth 2 -type f \( -iname 'license*' -o -iname 'copying*' \) -print | sort > "$root/receipt/LICENCE_FILES.txt"
          sha256sum "$root/source"/* > "$root/receipt/SHA256SUMS.txt"
          printf 'tool=wine\nversion=11.0\npin_sha=%s\nresolved_sha=%s\ntree_sha=%s\nrun_id=%s\n' "$pin" "$actual" "$tree" "$GITHUB_RUN_ID" > "$root/receipt/IDENTITY.txt"
          rm -rf "$root/repo"
      - name: Upload Wine source custody
        uses: actions/upload-artifact@v4
        with:
          name: flp6-wave1-wine-source
          path: _closeout/wine
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  lief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Acquire exact LIEF 1.0.0 source and canonical Windows asset
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/_closeout/lief"
          mkdir -p "$root/source" "$root/release/all" "$root/receipt"
          pin='d05b3499b6934137e917c009a4df0a9dc8cb11c5'
          expected='1ad0799a5e699505f7e4ad31fd196105867cf29fd8b74485f32d02cfaba94fe2'
          git init -q "$root/repo"
          git -C "$root/repo" remote add origin https://github.com/lief-project/LIEF.git
          git -C "$root/repo" fetch -q --depth=1 origin "$pin"
          git -C "$root/repo" checkout -q --detach FETCH_HEAD
          actual="$(git -C "$root/repo" rev-parse HEAD)"
          tree="$(git -C "$root/repo" rev-parse 'HEAD^{tree}')"
          test "$actual" = "$pin"
          git -C "$root/repo" archive --format=tar "$pin" | gzip -9 > "$root/source/lief-${pin}.tar.gz"
          git -C "$root/repo" ls-tree -r --full-tree "$pin" > "$root/receipt/GIT_TREE.txt"
          gh release view 1.0.0 -R lief-project/LIEF --json assets > "$root/receipt/RELEASE_ASSETS.json"
          gh release download 1.0.0 -R lief-project/LIEF -D "$root/release/all"
          match=''
          while IFS= read -r -d '' f; do
            h="$(sha256sum "$f" | awk '{print $1}')"
            if test "$h" = "$expected"; then match="$f"; break; fi
          done < <(find "$root/release/all" -maxdepth 1 -type f -print0)
          test -n "$match"
          mkdir -p "$root/release/canonical"
          cp "$match" "$root/release/canonical/$(basename "$match")"
          printf '%s  %s\n' "$expected" "$root/release/canonical/$(basename "$match")" | sha256sum -c -
          find "$root/release/all" -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > "$root/receipt/ALL_RELEASE_FILES.txt"
          rm -rf "$root/release/all"
          sha256sum "$root/source"/* "$root/release/canonical"/* > "$root/receipt/SHA256SUMS.txt"
          printf 'tool=lief\nversion=1.0.0\npin_sha=%s\nresolved_sha=%s\ntree_sha=%s\ncanonical_windows_sha256=%s\nrun_id=%s\n' "$pin" "$actual" "$tree" "$expected" "$GITHUB_RUN_ID" > "$root/receipt/IDENTITY.txt"
          rm -rf "$root/repo"
      - name: Upload LIEF custody
        uses: actions/upload-artifact@v4
        with:
          name: flp6-wave1-lief
          path: _closeout/lief
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
