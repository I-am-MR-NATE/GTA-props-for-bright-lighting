name: FLP6 Wave1 Recursive Build Closeout

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/flp6-wave1-open-ferry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamorio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone exact DynamoRIO identity with recursive gitlinks
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/_build/dynamorio"
          pin='59352ff71fefdb8542fc5bd2ae3b76181a50072e'
          mkdir -p "$root/receipt" "$root/release"
          git init -q "$root/repo"
          git -C "$root/repo" remote add origin https://github.com/DynamoRIO/dynamorio.git
          git -C "$root/repo" fetch -q --depth=1 origin "$pin"
          git -C "$root/repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root/repo" rev-parse HEAD)" = "$pin"
          git -C "$root/repo" submodule update --init --recursive
          git -C "$root/repo" submodule status --recursive > "$root/receipt/SUBMODULE_STATUS_RECURSIVE.txt"
          test -z "$(grep '^-' "$root/receipt/SUBMODULE_STATUS_RECURSIVE.txt" || true)"
          printf 'pin=%s\ntree=%s\n' "$pin" "$(git -C "$root/repo" rev-parse 'HEAD^{tree}')" > "$root/receipt/IDENTITY.txt"
      - name: Build DynamoRIO release tools
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/_build/dynamorio"
          cmake -S "$root/repo" -B "$root/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF > "$root/receipt/CONFIGURE.log" 2>&1
          cmake --build "$root/build" -j2 > "$root/receipt/BUILD.log" 2>&1
          while IFS= read -r -d '' f; do cp "$f" "$root/release/"; done < <(find "$root/build" -type f \( -name drrun -o -name drconfig \) -perm -111 -print0)
          test -f "$root/release/drrun"
          "$root/release/drrun" -version > "$root/receipt/SMOKE.txt" 2>&1 || "$root/release/drrun" -help > "$root/receipt/SMOKE.txt" 2>&1 || true
          file "$root/release"/* > "$root/receipt/FILE_TYPES.txt"
          sha256sum "$root/release"/* > "$root/receipt/SHA256SUMS.txt"
          rm -rf "$root/repo" "$root/build"
      - name: Upload DynamoRIO runnable closeout
        uses: actions/upload-artifact@v4
        with:
          name: flp6-dynamorio-runnable
          path: _build/dynamorio
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  vst3validator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone exact VST3 SDK identity with recursive gitlinks
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/_build/vst3validator"
          pin='3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96'
          mkdir -p "$root/receipt" "$root/release"
          git init -q "$root/repo"
          git -C "$root/repo" remote add origin https://github.com/steinbergmedia/vst3sdk.git
          git -C "$root/repo" fetch -q --depth=1 origin "$pin"
          git -C "$root/repo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$root/repo" rev-parse HEAD)" = "$pin"
          git -C "$root/repo" submodule update --init --recursive
          git -C "$root/repo" submodule status --recursive > "$root/receipt/SUBMODULE_STATUS_RECURSIVE.txt"
          test -z "$(grep '^-' "$root/receipt/SUBMODULE_STATUS_RECURSIVE.txt" || true)"
          grep '586dc5e6c8012c3e4b01c79389375cbe96bdb1da public.sdk' "$root/receipt/SUBMODULE_STATUS_RECURSIVE.txt"
          printf 'pin=%s\ntree=%s\n' "$pin" "$(git -C "$root/repo" rev-parse 'HEAD^{tree}')" > "$root/receipt/IDENTITY.txt"
      - name: Build official VST3 validator
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE/_build/vst3validator"
          cmake -S "$root/repo" -B "$root/build" -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF > "$root/receipt/CONFIGURE.log" 2>&1
          cmake --build "$root/build" --target validator -j2 > "$root/receipt/BUILD.log" 2>&1
          val="$(find "$root/build" -type f -name validator -perm -111 | head -n1)"
          test -n "$val"
          cp "$val" "$root/release/validator"
          "$root/release/validator" -selftest > "$root/receipt/SELFTEST.txt" 2>&1
          file "$root/release/validator" > "$root/receipt/FILE_TYPES.txt"
          sha256sum "$root/release/validator" > "$root/receipt/SHA256SUMS.txt"
          rm -rf "$root/repo" "$root/build"
      - name: Upload VST3 validator runnable closeout
        uses: actions/upload-artifact@v4
        with:
          name: flp6-vst3-validator-runnable
          path: _build/vst3validator
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
